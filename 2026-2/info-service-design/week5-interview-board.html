<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>U01 인터뷰 태깅 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f4f4f4;--card:#fff;--ink:#222;--ink2:#555;--ink3:#8a8a8a;--line:#e3e3e3;
--P:#e5484d;--Pb:#fde2e4;--N:#c99700;--Nb:#fff3bf;--E:#1f9d55;--Eb:#d8f5e3;--F:#1c7ed6;--Fb:#d7ecfb;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:rgba(244,244,244,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:18px 28px 0}
.top{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;justify-content:space-between}
h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
.meta{font-size:13px;color:var(--ink2);margin-top:4px}
.draft{display:inline-block;background:#222;color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools input{font:inherit;font-size:14px;padding:8px 12px;border:1px solid #d4d4d4;border-radius:10px;width:220px;background:#fff}
.btn{font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;border:1px solid #d4d4d4;background:#fff;cursor:pointer}
.btn:hover{background:#f0f0f0}
.rv{font-size:13px;color:var(--ink2)}
nav{display:flex;gap:4px;margin-top:16px;overflow-x:auto}
nav button{font:inherit;font-size:15px;font-weight:600;border:none;background:none;padding:10px 14px 12px;cursor:pointer;color:var(--ink3);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--ink)}
nav .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
nav .n{font-size:12px;color:var(--ink3);margin-left:4px;font-weight:500}
main{padding:24px 28px 80px}
.intro{font-size:14px;color:var(--ink2);margin-bottom:18px;line-height:1.6}
.board{columns:320px;column-gap:18px}
.grp{break-inside:avoid;background:#ebebeb;border-radius:18px;padding:14px 14px 6px;margin-bottom:18px}
.grp h3{font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin:2px 4px 12px}
.grp h3 .c{font-size:12px;font-weight:600;color:#fff;border-radius:999px;padding:2px 9px}
.card{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;border-left:5px solid #ccc;transition:transform .08s}
.card:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.08)}
.card .q{font-size:14px;line-height:1.55}
.card .lb{font-size:12.5px;color:var(--ink2);margin-top:6px}
.card .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.card .pid{font-size:11px;color:var(--ink3)}
.card .st{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#f1f1f1;margin-left:6px}
.rvb{display:flex;gap:4px}
.rvb button{font:inherit;font-size:12px;border:1px solid #ddd;background:#fff;border-radius:6px;padding:2px 7px;cursor:pointer;color:#777}
.rvb button.on[data-v="채택"]{background:#1f9d55;color:#fff;border-color:#1f9d55}
.rvb button.on[data-v="수정"]{background:#f08c00;color:#fff;border-color:#f08c00}
.rvb button.on[data-v="기각"]{background:#777;color:#fff;border-color:#777}
.card.rej{opacity:.45}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media(max-width:1100px){.cols{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.cols{grid-template-columns:1fr}header,main{padding-left:16px;padding-right:16px}}
.catcol{background:#fff;border-radius:18px;padding:18px}
.catcol h2{font-size:19px;display:flex;align-items:center;gap:8px}
.catcol .desc{font-size:12.5px;color:var(--ink3);margin:4px 0 14px}
.th{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:14px}
.th:hover{filter:brightness(.97)}
.th b{font-size:13px}
.kwbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.kw{font:inherit;font-size:14px;border:1px solid #d6d6d6;background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer}
.kw span{font-size:12px;color:var(--ink3);margin-left:5px}
.kw.on{background:#222;color:#fff;border-color:#222}.kw.on span{color:#bbb}
.bar{height:6px;border-radius:3px;background:#222;opacity:.15;margin-top:4px}
.res{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:14px;line-height:1.6;cursor:pointer}
.res .pid{font-size:11px;color:var(--ink3);margin-bottom:4px}
mark.k{background:#222;color:#fff;border-radius:3px;padding:0 2px}
.hl-P{background:var(--Pb);box-shadow:inset 0 -2px 0 var(--P)}
.hl-N{background:var(--Nb);box-shadow:inset 0 -2px 0 var(--N)}
.hl-E{background:var(--Eb);box-shadow:inset 0 -2px 0 var(--E)}
.hl-F{background:var(--Fb);box-shadow:inset 0 -2px 0 var(--F)}
.tr{max-width:900px}
.tr .Q{font-weight:800;font-size:16px;margin:26px 0 8px}
.tr .S{color:var(--ink2);font-size:13.5px;margin:14px 0 4px}
.tr .A{background:#fff;border-radius:12px;padding:12px 16px;font-size:14.5px;line-height:1.75;margin-bottom:6px}
.tr .A.focus{outline:3px solid #222}
.filt{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;font-size:14px}
.filt label{display:flex;align-items:center;gap:6px;cursor:pointer}
.panel{position:fixed;top:0;right:0;width:min(520px,100%);height:100%;background:#fff;box-shadow:-10px 0 30px rgba(0,0,0,.12);z-index:40;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.panel.open{transform:none}
.panel .hd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.panel .bd{padding:18px 22px;overflow:auto;font-size:14.5px;line-height:1.75}
.panel .qq{color:var(--ink2);font-size:13.5px;margin-bottom:10px}
.panel .aa{background:#f7f7f7;border-radius:12px;padding:14px 16px}
.panel .tags{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.panel .tg{border-radius:10px;padding:10px 12px;font-size:13.5px}
.x{font-size:22px;border:none;background:none;cursor:pointer;color:#666}
.note{background:#fff;border-radius:14px;padding:14px 18px;font-size:13.5px;color:var(--ink2);line-height:1.6;margin-top:24px}
.empty{color:var(--ink3);font-size:14px;padding:20px 0}
.ib{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:#3b3b3b;border-radius:5px;padding:1px 5px;margin-left:3px;cursor:pointer;vertical-align:2px;line-height:1.4}
sup.ib{vertical-align:6px;font-size:9.5px;padding:0 4px}
.ib:hover{background:#000}
.insg{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px}
@media(max-width:640px){.insg{grid-template-columns:1fr}}
.ins{background:#fff;border-radius:18px;padding:22px 24px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ins .no{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--ink3)}
.ins h3{font-size:19px;line-height:1.4;margin:6px 0 10px}
.ins .stt{font-size:14px;line-height:1.7;color:#333}
.ins .mt{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink2);margin:14px 0 8px}
.conf{font-weight:700;background:#f1f1f1;border-radius:6px;padding:2px 8px}
.comp{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:#fff;margin-bottom:6px}
.comp i{display:block;height:100%}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.leg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--c)}
.hmw{margin-top:14px;background:#f6f6f6;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6}
.hmw b{display:block;font-size:11.5px;color:var(--ink3);letter-spacing:.5px;margin-bottom:2px}
.ins details{margin-top:12px}.ins summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2)}
.ev{font-size:13.5px;line-height:1.55;padding:9px 12px;border-radius:10px;background:#fafafa;margin-top:6px;cursor:pointer;border-left:4px solid #ccc}
.ev small{display:block;color:var(--ink3);font-size:11.5px;margin-top:2px}
.ins .acts{display:flex;gap:8px;margin-top:14px}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border-radius:14px;padding:14px 18px;margin-bottom:20px;font-size:13.5px}
.flow .st2{background:#f1f1f1;border-radius:8px;padding:6px 10px;font-weight:700}
.ichips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ichip{font:inherit;font-size:13px;border:1px solid #d6d6d6;background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}
.ichip.on{background:#222;color:#fff;border-color:#222}
.ifocus{background:#222;color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:16px;line-height:1.6}
.ifocus small{color:#bbb}
.tr .A.dim{opacity:.35}
.chartwrap{background:#fff;border-radius:18px;padding:20px 22px;margin-bottom:18px}
.chartwrap h3{font-size:16px;margin-bottom:4px}.chartwrap p{font-size:12.5px;color:var(--ink3);margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:1000px){.two{grid-template-columns:1fr}}
svg text{font-family:inherit}
.brow{cursor:pointer}.brow:hover rect.hit{fill:#f3f3f3}
#tip{position:fixed;pointer-events:none;background:#222;color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;z-index:60;display:none;max-width:280px;line-height:1.45}
table.hm{border-collapse:separate;border-spacing:2px;font-size:12.5px;width:100%}
table.hm th{font-weight:600;color:var(--ink2);padding:4px 6px;text-align:center;white-space:nowrap}
table.hm th.r{text-align:right;color:var(--ink)}
table.hm td{text-align:center;border-radius:4px;height:26px;min-width:38px;cursor:default}
</style></head><body>
<header>
 <div class="top">
  <div><h1>U01 인터뷰 태깅 분석 보드 <span class="draft">AI 분석 초안 · 검수 필요</span></h1>
  <div class="meta">레저/아웃도어(자전거) 사용자 인터뷰 · 기아 스포티지 사용자 · 원문 문단 기준 근거 연결</div></div>
  <div class="tools"><input id="q" placeholder="카드 검색 (예: 트렁크, 소리)"><span class="rv" id="rvc"></span><button class="btn" id="csv">검수 결과 CSV 저장</button></div>
 </div>
 <nav id="nav"></nav>
</header>
<main id="main"></main><div id="tip"></div>
<aside class="panel" id="panel"><div class="hd"><b id="ph">원문 맥락</b><button class="x" id="px">×</button></div><div class="bd" id="pb"></div></aside>
<script>
const D={"paras": [{"i": 0, "k": "T", "t": "User Interview Script_레저/아웃도어_U01"}, {"i": 2, "k": "Q", "t": "Q. [pxd] 자전거는 얼마나 타셨나요?"}, {"i": 3, "k": "A", "t": "그 전에는 미니 벨로라고 하죠. 그런 식으로 탔었는데 그것까지 포함을 한다면 5년 이상 된 것 같습니다. "}, {"i": 4, "k": "S", "t": "ㄴ [pxd] 자전거를 많이 타신다고 들었는데 한번 타시면 얼마나 타시고 얼마나 자주 타세요?"}, {"i": 5, "k": "A", "t": "주중에는 날씨가 좋으면 최대한 많이 타려고 하는데 그게 평균적으로 한 주 2-3회는 되는 것 같습니다."}, {"i": 6, "k": "S", "t": "ㄴ [pxd] 한번 탈 때 몇 시간 정도 타시나요?"}, {"i": 7, "k": "A", "t": "평일에는 다음 날 출근도 있고 하다 보니 집에 도착해서 한 8시에 나와서 11시 까지.. 한 3시간 정도 타는 경우가 있고요. 주말에는 좀 많이 타는 편이예요. 여름에는 더우니까 새벽에 나가요. 한 5시쯤 나가서 적어도 1시 전에는 돌아 오려고 하고 있고요. 봄 가을에는 6-7시쯤 나가서 12시간 정도 타게 되는데 계속 그렇게 타는 것이 아니라 중간에 쉬는 시간도 있고 식사도 하다 보니까 그렇게 되는데 자전거만 탄다고 보면 한 8시간은 타게 되는 것 같아요. 주말에는.."}, {"i": 8, "k": "S", "t": "ㄴ [HMC] 자전거 몇 대 갖고 계신 거예요?"}, {"i": 9, "k": "A", "t": "자전거 지금 한 대 갖고 있습니다."}, {"i": 10, "k": "S", "t": "ㄴ [HMC] 어떤 자전거를 갖고 계신가요?"}, {"i": 11, "k": "A", "t": "로드 자전거 입니다. "}, {"i": 12, "k": "S", "t": "ㄴ [HMC] 주로 평일에 시간 되시면 자전거를 타신다고 하셨는데 주로 루트가 어떻게 되시나요?"}, {"i": 13, "k": "A", "t": "제가 집이 이쪽이다 보니까 자전거가 종류를 크게 두 가지로 MTB랑 로드로 나눈다고 보면은 MTB같은 경우에는 산에 이렇게 오프로드를 올라가서 내려오는 위주로 타는.. 다운힐이라고 하거든요. 다운힐을 위주로 하는 자전거이고요. 로드 같은 경우는 워크힐을 주로 하는 자전거라고 보시면 돼요."}, {"i": 14, "k": "S", "t": "ㄴ [HMC] 일반인들이 봤을 때 싸이클처럼 생긴 것이 로드인가요?"}, {"i": 15, "k": "A", "t": "네네. 맞습니다. 그래서 고개를 넘거든요 그게 이 경사도가 있는.. 그런 고개들이 보통 어떠한 지역의 경계 쪽에 산들이 있다 보니까 그렇게 타는데, 제가 이쪽에서 타면은 저희 동네.. 이 성남 쪽에 고개가 많아요. 그래서 갈마치 고개라던지 하오고개라던지 여우고개라던지.. 그런 고개를 타게 되거든요. 그러면 시간이 그정도 되고요. 그 다음에 평지를 타게 되는 경우는 반포.. 한강까지 대충.. 평일에는? 그정도 타고 오면 한 두 시간에서 두 시간 반 정도 소요를 하고, 남산이나 북악 같은 데도 갔다 올 때가 있어요. 그렇게 타는 경우도 있고.."}, {"i": 16, "k": "S", "t": "ㄴ [HMC] 퇴근 시간에 교통 통행량도 많을텐데 괜찮으세요?"}, {"i": 17, "k": "A", "t": "우선은 이쪽 부근에.. 구 도로라고 하죠. 저희가 구도로.. 신도로 같은 경우는 터널이 뚫리거나 이렇게 돼가지고.. 그런데, 구도로를 잘 안 쓰는 경우가 많아서 성남이랑 안양 사이에 구도로가 있고 판교가 생기면서 신도로가 뚫렸는데 그 쪽에는 통행량이 별로 없거든요. 차량이. 그래서 그런 쪽을 많이 이용을 하는 편이고.."}, {"i": 18, "k": "S", "t": "ㄴ [HMC] 저 인덕원 넘어가는 그 쪽이요?"}, {"i": 19, "k": "A", "t": "네네. 맞습니다. 그 쪽을 이용하는 편이고, 평지 같은 경우에는 여기 탄천에서 한강까지 자전거 도로가 되어있기 때문에 그렇게 타는 식으로 타고 있습니다."}, {"i": 20, "k": "S", "t": "ㄴ [pxd] 자전거를 자동차에 싣고 이동해서 타는 경우도 있나요?"}, {"i": 21, "k": "A", "t": "네. 많이 있습니다. 투어라고 해서 지난주에 지리산을 다녀왔는데 그때는 실어서 그 동네를 탄다거나 기차에 실어서 타는 경우도 있고요. 그렇게 요즘에는 자전거 캐리어라고 해서 여행용 캐리어가 있어요. 그래서 그거를 구매를 해서 해외 갈 때 가지고 가서 해외에서 타는 경우도 있고, 배 타고 가서 타는 경우도 있고요."}, {"i": 22, "k": "S", "t": "ㄴ [pxd] 자동차로 자전거를 싣고 이동하실 때 어떤 식으로 많이 이동하시나요?"}, {"i": 23, "k": "A", "t": "제가 이번에 차를 구매하게 된 것이 작년 11월에 구매를 했는데 그 차 같은 경우도 자전거를 한 번에 실기 위해서 좀 큰 차가 필요하다고 생각을 해서 이 차를 구매하게 됐고요. 뒷 좌석 폴딩해서 트렁크 열어서 바로 한 번에 바퀴도 안 빼고 그냥 바로 넣거든요. 한 대만 넣는다면.. 그래서 지금 이 차를 구매해서 그렇게 사용하고 있어요."}, {"i": 24, "k": "S", "t": "ㄴ [HMC] 지금 바이크 랙을 설치 안 하시고 그냥 사용하시나요?"}, {"i": 25, "k": "A", "t": "네. 그 랙을 설치하게 되면 사람들이 차 안에 많이 탈 수 있거나 그런 것들이 좋긴 한데 우선은 그 랙을 설치하게 되면 번호판을 새로 달아야 하거든요. 뒤 쪽에다 달거나.. 번호판을 가리면 안되니까. 그런게 있고, 또 상단에다 다는 경우가 있잖아요. 상단에다 달게 되면 시야가 안 보이기 때문에 터널이나 자전거가 얼마나 높이가 되는지 몰라요. 그때 터널에 들어가면서 자전거가 박살나게 되는 경우가 있거든요. 그런 경우도 있고.. 또 랙 말고 또 다른 경우에는 사람들이 많이 사용하는 것이 씨써커라는.."}, {"i": 26, "k": "S", "t": "ㄴ [pxd] 앞 쪽의, 조수석 쪽에 다는 것을 말씀하시는거죠?"}, {"i": 27, "k": "A", "t": "네. 앞 쪽에 유리창에다 달아서 하는 경우가 있는데 그거는 조수석이나 운전석에 다는 경우도 있고.. 시야로 자전거가 어느 정도 높이인지 보이니까 그런 것들 때문에 그렇게 사용하는 경우도 있고요."}, {"i": 28, "k": "S", "t": "ㄴ [pxd] 그렇게 외장에 달으시려고 추가적으로 구매하신 것이 있나요?"}, {"i": 29, "k": "A", "t": "아니요. 없어요. 그 이유가 아까도 말씀드리려고 했는데, 사고가 났을 때 보험처리가 안 되거든요. 바깥에 있는 것들은 보험 처리가 안 되기 때문에 차량 안에다 놔야 보험 처리가 된다고 제가 알고 있어서 최대한 안에다가 넣으려고 하고 있습니다. 제가 잘못 알고 있는 것일 수도 있는데.."}, {"i": 30, "k": "S", "t": "ㄴ [pxd] 지금 차 말고 이전 차는 어떤 건가요?"}, {"i": 31, "k": "A", "t": "전에 차는 모닝 탔어요."}, {"i": 32, "k": "S", "t": "ㄴ [pxd] 모닝 타실 때도 자전거를 실으셨나요?"}, {"i": 33, "k": "A", "t": "네. 다 실고 다녔어요."}, {"i": 34, "k": "S", "t": "ㄴ [pxd] 그때도 안에다가 실으셨나요?"}, {"i": 35, "k": "A", "t": "네. 안에다가.. 그때 바퀴 빼고.. 앞바퀴는 탈거가 쉽거든요. 그렇게 해서 실어서 갔는데 그것조차 귀찮아서요."}, {"i": 36, "k": "S", "t": "ㄴ [HMC] 바이크 랙이 자전거를 적재를 하면 차 폭보다 훨씬 더 커지거나 높이 달리게 돼서요?"}, {"i": 37, "k": "A", "t": "보통 높이 달아지죠."}, {"i": 38, "k": "S", "t": "ㄴ [HMC] 그래서 터널 들어갈 때 우려점들이 생기시는데요. "}, {"i": 39, "k": "A", "t": "그러니까 걱정을 하는거죠. 사진 하나 보여드려도 될까요? 아까 전에 말씀 드렸던 씨써커가 이렇게 생겼습니다. 그래서 창문이나 이런데다가 설치를 하는데, 그게 지금 차량에 보통 선루프가 있잖아요. 그런게 열리거나 그렇게 될 수 있거든요. 조작을 잘 못 한다거나.. 착각을 해서 창문을 열고 싶은데 그걸 잘못 누르면은 안 되기 때문에 이쪽 앞쪽으로 다는 경우나, 아니면 아예 뒤쪽에다 다는 경우나.. 이렇게 하는데, 앞쪽에다 다는 이유는 시야를 확보하려고.."}, {"i": 40, "k": "A", "t": "(사진 보여주며) 이런 식으로 실어서 가거든요. 투어갈 때.. 단체 좀 사람 많을 때는 승합차에다가.."}, {"i": 41, "k": "S", "t": "ㄴ [HMC] 이러면 루프 랙인거죠? 저는 바이크 랙 이런 뒤로 하는 그런 거를 생각했었는데요. "}, {"i": 42, "k": "A", "t": "뒤에도 달려 있고요. "}, {"i": 43, "k": "S", "t": "ㄴ [HMC] 위의 루프 랙 말고도 뒤의 바이크 랙에 장착을 해도, 차의 높이보다 루프 랙이 높이 올라와서 터널 지나갈 때는 어떤가요?"}, {"i": 44, "k": "A", "t": "여기다가 달면, 뒤 쪽의 후미쪽에 달면 높이는 상관이 없죠. 그런데 번호판을 새로 또 시청가서 발급 받아야 하고 부착을 해야 하고 이런 것들이 있기 때문에 만약에 안 달았을 때 번호 미부착으로 걸리면 벌금도 내야 하니까 그런 것들도.."}, {"i": 45, "k": "S", "t": "ㄴ [HMC] 그러면 같이 라이딩 다니시는 동호회 분들 대부분 차 안에다 넣고 다니시는 편이세요? 단체로 어디 멀리 갈 때 빼고는요?"}, {"i": 46, "k": "A", "t": "그냥 혼자 갈 때는 대부분 차 안에 두죠. 위에 다가 다는 경우는 두 대 이상. 만약에 그런 캐리어들이 있는 사람에 한해서. 두 대 이상이 될 때는 그렇게 하는 걸로 알고 있어요."}, {"i": 47, "k": "S", "t": "ㄴ [pxd] 그렇게 자전거 타러 가실 때 투어나 차에 자전거를 싣고 가실 때 혼자 운전해서 가세요? 보통 동행과 함께 가시나요?"}, {"i": 48, "k": "A", "t": "저 같은 경우는 혼자 운전하는 편이고요. 번갈아 가며 운전할 때도 있고 렌트 카를 하게 되면 그거랑 상관 없이 신청만 하면 되니까 여러 명이서 하는 경우도 있고.. 그러지 않고서는 보통 혼자 하는 것 같아요."}, {"i": 49, "k": "S", "t": "ㄴ [pxd] 혼자 다니시니까 자전거 랙 같은 것은 굳이 필요 없이 수납해서 다니시는건가요?"}, {"i": 50, "k": "A", "t": "네. 그리고 저는 차에 세 대까지도 실어봤거든요. 뒷 바퀴까지 다 빼서 체인을 또 고정하는 부품이 따로 있어요. 그런 식으로 해서 뒷 바퀴까지 빼면 되게 간소화가 되니까 그렇게 해서 세 대까지 실어봤어요. 네 대는 아직 안 실어봤고요."}, {"i": 51, "k": "S", "t": "ㄴ [pxd] 차에 자전거를 싣기 위해서 체인 거는 거라든지 추가적으로 구입하신 물품이 어떤 것이 있으신가요?"}, {"i": 52, "k": "A", "t": "그거는 자전거 샵에서 샀는데 그거 말고 따로 산 것은 없는 것 같아요. 아니면 자전거를 여러 대 하면 겹치다 보니까 그 겹치는 부분에 자전거가 손상이 되면 안 돼서 그거를 방지하기 위해서 우리가 흔히 쓰는 요가 매트 같은 것을 좀 쿠션 있는 걸로 해서 그런 식으로.. 지금 두 개가 차에 있는데, 자전거를 세 대 넣으면 사이사이에 넣기 위해서.."}, {"i": 53, "k": "S", "t": "ㄴ [pxd] 그러면 이제 자전거를 실었을 때 말고 평소에는 후석을 펴놓으시고 사용하시나요?"}, {"i": 54, "k": "A", "t": "그냥 자전거를 실을 때 접잖아요. 폴딩을 하고 나서 따로 누군가가 안 타면 계속 접혀져 있어요."}, {"i": 55, "k": "S", "t": "ㄴ [pxd] 항상 평소에도 거의 자전거가 실어진 상태인가요?"}, {"i": 56, "k": "A", "t": "아뇨. 계속 그렇게 다니진 않아요. 왜냐하면 자전거가 이 상하의 충격은 되게 좋은데 좌우의 충격이 없는게.. 그런데 눕혀있잖아요. 계속 그 충격이 있으면 안 좋기 때문에 최대한 필요에 의해서 갈 때 빼고는 집에다가 놓는 편이에요."}, {"i": 57, "k": "S", "t": "ㄴ [pxd] 좀 민감할 수도 있는 질문인데, 자전거 관련해서 얼마 정도 투자를 하셨나요? 전체적으로요. "}, {"i": 58, "k": "A", "t": "의류까지 포함을 해야하나요?"}, {"i": 59, "k": "S", "t": "ㄴ [pxd] 정확하게 말씀 안 해주셔도 돼요. 천 만원 정도, 아니면 몇 백 정도로요. "}, {"i": 60, "k": "A", "t": "천 만원 이상? 이 천 만원까지 되지는 않을 거 같고요."}, {"i": 61, "k": "S", "t": "ㄴ [HMC] 바이크에만요?"}, {"i": 62, "k": "A", "t": "옷까지 포함을 해서요. 한 이 천 만원? 자전거 의류가 싼 것도 있는데 비싼 것들이 많이 있어서요. 그런 비싼 거를 저는 사는 편이여서.. "}, {"i": 63, "k": "S", "t": "ㄴ [HMC] 의류가 어느 정도 가격인가요?"}, {"i": 64, "k": "A", "t": "그러니까 이게 바지가 있고요. 위에 져지라고 해서 져지가 있고, 빕이라고 해서 멜빵으로 돼서 입는 패드까지 있는 바지가 있는데 이 바지만 한 40만원 정도 하는 것 같은데, 위의 것 저지는 한 30만원 정도 하고요. "}, {"i": 65, "k": "S", "t": "ㄴ [pxd] 차에 자전거를 싣고 다니실 때 추가적으로 구입하신 것은 체인 걸이 정도라고 하셨는데 그런 것 외에 요가 매트처럼 자전거를 싣기 위해 준비하는 용품들이 어떤 것들이 있나요? 아니면 투어 가실 때 자전거 외에 추가적으로 수납하시는 것이 있나요?"}, {"i": 66, "k": "A", "t": "자전거 외에 추가적으로 수납하는 것은 펌프. 펌프나 공구 같은 것들.. 자전거가 만약에 문제가 생겼을 때 그거를 처리할 수 있는 것.. 그거 말고는 없는 것 같아요. 우선은 펌프가 제일.. 오일은 뭐 얼마 크기가 안 돼서.."}, {"i": 67, "k": "S", "t": "ㄴ [pxd] 펌프 같은 것도 항상 수납을 하시나요?"}, {"i": 68, "k": "A", "t": "투어를 갈 때 자전거를 실고 갈 때만 들고 나와서 넣죠. 그리고 그 펌프 같은 경우는 하나 가져가서 여러 명이서 다같이 쓸 수 있기 때문에 보통 한 명만 챙겨가요."}, {"i": 69, "k": "S", "t": "ㄴ [pxd] 현재 자동차가 스포티지라고 말씀하셨는데 구입하실 때 어떤 요인으로 스포티지를 선택하시게 되셨나요?"}, {"i": 70, "k": "A", "t": "아까 전에 말씀 드렸듯이, 제가 모닝을 타고 있어서 차도 바꿀 때가 돼서 알아 봤는데 자전거를 좀 편하게 실을 수 있는 크기가 스포티지 이상으로 제가 생각을 해서요. 거의 그것 때문인 것 같아요. 다른 승용차도 다른 가격이 비슷한 것이 있겠지만 그것 때문에 선택하게 되었어요."}, {"i": 71, "k": "S", "t": "ㄴ [pxd] 스포티지 말고 투싼도 있고 같은 급에서요. 스포티지를 선택한 것이 단순히 디자인일 수도 있고, 아니면 자전거 실기에 딱 보기 좋아 보일 수도 있고, 어떤 것 때문에 스포티지를 선택하셨는지요?"}, {"i": 72, "k": "A", "t": "투싼보다는 제가 스포티지를 선호해서요."}, {"i": 73, "k": "S", "t": "ㄴ [pxd] 디자인적으로요?"}, {"i": 74, "k": "A", "t": "네."}, {"i": 75, "k": "S", "t": "ㄴ [HMC] 어떤 점을 더, 차이가 어떤 게 있을까요?"}, {"i": 76, "k": "A", "t": "익스테리어 쪽에.. 인테리어도 투싼이 제가 알기로는 뭐라 그러지? 이름 까먹었네. 아무튼 디자인 형태가 있었잖아요. 예전에 YF 소나타를 기점으로 찢어지는 그 디자인을 제가 싫어하거든요. 그런데 투싼이 제가 거의 막바지의 디자인으로 알고 있어가지고 그거를 배제를 아예 해버렸어요. 그래서 스포티지를.."}, {"i": 77, "k": "S", "t": "ㄴ [pxd] 차이점은 디자인이 제일 컸네요."}, {"i": 78, "k": "A", "t": "어떻게 보면 그렇다고 할 수 있죠."}, {"i": 79, "k": "S", "t": "ㄴ [pxd] 스포티지를 구매하실 때 자전거를 넣기 위해 테스트 해보는 것들 있잖아요. 폴딩이 좀 편하게 되나 이런 것들을 확인하셨나요?"}, {"i": 80, "k": "A", "t": "그것까지는 확인을 하지 않았어요. 보통 폴딩이 되는지 안 되는지 여부를.. 스포티지 사기 전에 다른 승용차를 볼 때도 폴딩이 되는지 안 되는지를 먼저 봤던 것 같고요. 폴딩이 되는 방식이 어렵다 쉽다는 안 봤던 것 같아요. 가서 내가 일일히 만져보고 할 수 있는 시간적 여유도 없었고.. 그냥 요즘 뭐 쉽게 되는 걸로 알고 있어서요."}, {"i": 81, "k": "S", "t": "ㄴ [pxd] 그럼 현재 차 말고 물론 지금 사신지 얼마 안 되셨지만 다음 차를 사신다던지 아니면 지금 차에 없어서 아쉬운 기능 같은 것이 있으신가요? 이런 기능이 있었으면 좋겠는데 다음에는 이런 기능이 있는 차를 사야겠다 또는 단순히 아쉽다 이런 것들이요."}, {"i": 82, "k": "A", "t": "기능이요? 레저 활동을 할 때의 기능들을 말씀하시는 건가요?"}, {"i": 83, "k": "S", "t": "ㄴ [pxd] 아뇨. 다른 기능을 말씀해주셔도 상관없어요."}, {"i": 84, "k": "A", "t": "제가 투싼과 고민을 했던 게 스포티지와 같은 급이더라도 옵션이 서로 다른 것으로 알고 있어요. 그래서 그게 현대 차하고 기아 차가 서로 더 팔게 하기 위해서의 목적으로 제가 알고 있는데.. 그런 부분? 만약에 제가 투싼을 샀으면 조수석에 통풍 시트가 들어 있을텐데 여기에는 없고요."}, {"i": 85, "k": "S", "t": "ㄴ [pxd] 운전석에만 있는 건가요?"}, {"i": 86, "k": "A", "t": "네. 운전석에만 있습니다. 그런 것들.. 그러니까 현대에 비해 기아가 옵션을 없앤 것. 그게 사면서 ‘왜 그렇지..’라는 의문이 들었고요. 그리고 현대 차에는.. 이 차는 아니지만 스틱이 있는데 기아 차에는 없고 이런 것들. 세분화가 덜 돼있다는 생각이 들어서.. 그런 것들 말고는 따로 그런 것은 없었던 것 같아요."}, {"i": 87, "k": "S", "t": "ㄴ [pxd] 같이 자전거 타시는 분들이 선호하는 차종이 있나요? 예를 들어서 골프 많이 치시는 분들은 골프 백이 많이 들어가는 제네시스를 선호하는 그런 것도 있고. 그런 이야기들이 있더라고요. 그래서 자전거 타시는 분들도 그런 것이 있으신지 궁금합니다."}, {"i": 88, "k": "A", "t": "지금 나이 대에 돈이 있으면 모르겠지만 굳이 제네시스까지는 생각을 안 하는 경우도.. 친구들 중에서 골프 치는 친구들도 있는데 골프 백 네 개 들어간다고.. 투싼이나 스포티지 같은 SUV를 선호하게 되는 경우가 있더라고요. 친구들의 경우에서도.. 그리고 자전거 타는 사람들은 대부분 SUV를 선호를 하고 그리고 다른 친구 중에서는 익스플로러가 좀 큰 편이여서 그거를 살까 고민했던 친구도 있거든요. 그런 식으로 약간 큰 차. 편하게 자전거를 실을 수 있거나 아까 말씀드렸듯이 골프 백을 많이 실을 수 있는 그런 것들 때문에 SUV를 선호하는 경우는 있는 것 같아요."}, {"i": 89, "k": "S", "t": "ㄴ [pxd] 자전거 투어링 가실 때 말고, 평소에는 자동차를 어떤 목적으로 많이 사용하세요?"}, {"i": 90, "k": "A", "t": "우선은 출퇴근으로 일 할 때 쓰고.. 많이 차 타고.. 예전부터 차를 썼어서 대중교통 타고 갈 때는 친구들이랑 술 약속 있을 때 말고는 대부분 차를 이용하는 편인 것 같아요."}, {"i": 91, "k": "S", "t": "ㄴ [pxd] 평소에 운전하실 때랑 레저용 자전거를 싣고 운전하실 때랑 달라지거나 추가적으로 준비하는 사항 같은 것이 있으신가요?"}, {"i": 92, "k": "A", "t": "우선은 안전하게 가게 되죠. 자전거가 손상이 되지 않게.. 그 부분 말고는.. 계속 자전거를 실었을 때 차를 움직이거나 어떤 충격이 있으면 덜컹덜컹 소리가 나면 신경이 쓰이고 떨림도 있잖아요. 차에. 어느 정도 떨림이 있기 때문에 떨릴 때 자전거 쪽에서 소리가 나면 세우거나 신호 대기 때 한번 훑어보는 경우도 있고요. 그렇게 하게 되죠."}, {"i": 93, "k": "S", "t": "ㄴ [pxd] 차 안에서 자전거를 고정시키는 노하우나 방법 같은 것이 있으신가요?"}, {"i": 94, "k": "A", "t": "고정을 따로 시키지는 않는데, 우선은 눕혀 놓기 때문에 한 번 눕혀놓으면 이동은 거의 많지 않아요. 왜냐면 우선은 안전하게 하다 보니 커브 돌 때도 어느 정도 속도를 저속으로 하게 되고.. 고정을 따로 시키지는 않아도 충분히 고정이 잘 되어 있는데, 휠을 빼게 되잖아요. 여러 대를 실었을 때. 그러면은 휠들이 돌아다닐 수가 있어요. 그거는 그냥 밴드 같은 거. 찍찍이 밴드라고 하죠. 벨크로.. 앞 뒤에 그게 있는데 그거를 휠 끼리 묶어서.. 휠도 손상이 되면 안 되거든요. 비싸서.. 그런게 또 있어서 그거 고정하는 것 같아요."}, {"i": 95, "k": "S", "t": "ㄴ [pxd] 찍찍이도 구매하신 건가요?"}, {"i": 96, "k": "A", "t": "네. 그것도 샀습니다."}, {"i": 97, "k": "S", "t": "ㄴ [pxd] 자전거를 실을 때 차에 자전거를 놓으면 차에 기스가 날 수도 있고 반대로 자전거에 기스가 날 수도 있잖아요. 실을 때 주의하시는 점이나 어떻게 실으시는지 자세하게 설명해주세요."}, {"i": 98, "k": "A", "t": "자전거죠. 자전거. 차보다는 자전거. 그렇게 하게 되는 것 같아요. 그런데 차에 기스가 나게 되면 자전거에도 기스가 나기 때문에 어쨌든 최대한 안 닿게 하려고 하는 것 같아요. 자전거든 차든."}, {"i": 99, "k": "S", "t": "ㄴ [pxd] 그냥 번쩍 들어서요? 조심히 드세요? 아니면 뭘 깔아 놓으신 다음에 싣나요?"}, {"i": 100, "k": "A", "t": "눕힐 때 이 닿는 면들이 있어요. 특히 페달 쪽 같은 경우에는 무게를 제일 많이 받는다고.. 그 쪽에만 이렇게 어느 정도 쿠션을 넣고요."}, {"i": 101, "k": "S", "t": "ㄴ [pxd] 아까 말씀하셨던 요가 매트를 넣으시는 거예요?"}, {"i": 102, "k": "A", "t": "네. 하나만 실을 때는 그런 식으로 해요."}, {"i": 103, "k": "S", "t": "ㄴ [pxd] 이건 이건 조금 넓은 범위의 질문인데요, 자전거를 즐거우시니까 타실 텐데. 자전거가 삶에서 어떤 가치를 주는 것 같아요? 예를 들어서 그냥 운동 수단일 수도 있고요."}, {"i": 104, "k": "A", "t": "그런데 운동을 제가 좀 여러 개를 많이 접해봤는데, 이렇게 좀 미친놈처럼 타는 경우는 자전거 말고는 없는 것 같아요. 다른 용품들도 많이.. 골프라던지 비싼 것들도 있긴 하지만 이것도 여느 것에 비해서 많이 들어가는 편이긴 한데, 그만큼 투자를 우선은 재정적으로도 많이 하게 되고, 시간도.. 거의 주말에는 자전거를 많이 타요. 그래서 금요일날 술을 안 먹어요. 불금이 없어요. 아침에 일찍 일어나야 해서.."}, {"i": 105, "k": "A", "t": "그리고 제가 서울에서 부산을 자전거를 타고 가면서 느꼈던 건데, 그랬을 때 느꼈던 것이 차를 타고 가거나 비행기 타고 가는 경우도 있고 기차 타고 가는 경우도 있고 한데 우리 나라에 이런 데가 있었나싶을 정도로 많은 것들을 보고 느꼈던 것 같아요."}, {"i": 106, "k": "S", "t": "ㄴ [HMC] 며칠 정도나 가세요?"}, {"i": 107, "k": "A", "t": "그때 월요일날 출근을 했었던 날이여서. 집에 저녁때 와서.. 4박5일. 월요일 저녁에 출발해서 금요일날 부산에 도착을 했습니다."}, {"i": 108, "k": "S", "t": "ㄴ [pxd] 올라오실 때도 자전거를 타셨나요?"}, {"i": 109, "k": "A", "t": "올라올 때는 기차를 탔습니다."}, {"i": 110, "k": "S", "t": "ㄴ [HMC] 배낭이나 짐 같은 것들을 뒤에 싣고 가시나요?"}, {"i": 111, "k": "A", "t": "네. 싣고 가는데 자전거 씨포스트라고 하는 안장 밑의 포스트가 있는데, 그쪽에다가 랙을 할 수 있는 가방이 있어요. 그거를 해서 그때는 갔고요."}, {"i": 112, "k": "S", "t": "ㄴ [HMC] 혼자 가신 거예요?"}, {"i": 113, "k": "A", "t": "친구랑 갔습니다. 아무튼 그런 식으로 매번 예를 들면 양평 쪽을 자전거를 또 타고 가는데 같은 여름이여도 매일 다르고, 갈때마다 풍경이 맨날 다르기 때문에 느끼는 것이 맨날 다르거든요. 그런 것들?"}, {"i": 114, "k": "S", "t": "ㄴ [HMC] 바보 같은 질문일 수 있지만 뭐가 그렇게 좋으신 거예요? 고개도 많고 힘들고, 내려갈 때는 좀 시원한 느낌? 그런 것도 있긴 하겠지만요."}, {"i": 115, "k": "A", "t": "그런데 내려갈 때는 안전을 최대한 해서 내려가는 편이고요. 속도는 한 60 킬로 이상 나올 수.. 선수들 같은 경우는 100 킬로 까지 나오거든요. 저희는 최대 한 60 킬로 안으로 하는 편이고.. 내려갈 때는 많이 다치는 경우가 많아서 최대한 조심을 하는 편이에요. 어필이라고 하는데.. 어필을 할 때는 이 되게 힘들거든요. 근데 이 끝까지 올라가서의 성취감이 있어요. 산에 보통 가보셨으면 성취감이 있잖아요. 산으로 치면 힘든 산을 올라갔을 때 “야호”도 하고 그런 것들이 있는데 이게 더.. 몸으로 느끼는 것은 더 힘든데 그 성취감이 더 크게 되는 거죠. 그리고 더 빠른 시간 내에 할 수 있고요. 산을 올라가면 1-2 시간 걸릴 것을 자전거를 탈 때 30분 정도 잡고 올라는데 그 성취감을 더 빠르게 더 크게 느끼는 것이 있는 것 같아요. 제가 봤을 때는요."}, {"i": 116, "k": "S", "t": "ㄴ [pxd] 자전거가 ‘자신의 삶에 ~다.’라고 정의를 한다고 가정을 하면 무엇인가요?"}, {"i": 117, "k": "A", "t": "전환점?"}, {"i": 118, "k": "S", "t": "ㄴ [pxd] 어떤 게 전환되신 건가요?"}, {"i": 119, "k": "A", "t": "아까 말씀드렸듯이 미니벨로 타고 이럴 때는 ‘마실’ 정도? 탄천 타고 잠실 다녀오고.. 반포 다녀오고, 여의도 다녀오면 많이 탔다고 생각했는데 지금은 전혀 그 정도는 그냥 마실이죠. 편하게 다녀오는 정도의 코스인데.. 지금 자전거를 타면서 모든 게 거의 자전거 쪽으로 다.. 친구들 만나면 “야, 자전거 안 타냐?”고 먼저 말하고 이런 식으로 할 만큼요."}, {"i": 120, "k": "S", "t": "ㄴ [HMC] 다른 세상에서 사시는 거네요."}, {"i": 121, "k": "A", "t": "네. 그 전과 다른 세상."}, {"i": 122, "k": "S", "t": "ㄴ [HMC] 일반적으로 시간 나면 친구들 만나서 술 한잔 하는 것을 조그만 낙으로 사는데 그걸 이제 절제하시는 거죠? 자전거 타시면서요."}, {"i": 123, "k": "A", "t": "네. 그걸 못 하는 거죠. 친구들 만나면 보통 토요일에 만나잖아요. 그래서 자전거를 우선 아침에 나와서 타고 집에 들어와서 한두 시간 쉬다가 저녁때 친구들 만나러 가죠. 만약에 친구를 만나게 되면.. 그래서 친구들한테 이야기하는 것이 친구들을 보고 싶은데, 자전거를 타면 못 보잖아요. 같이 타자고.."}, {"i": 124, "k": "S", "t": "ㄴ [pxd] 혼자 자전거 타실 때랑 친구분들 또는 동호회 분들이랑 자전거를 타실 때 어떤 점이 다르신 것 같아요? 다른게 좋은 점도 있고 나쁜 점도 있을 텐데.. 어떤 것은 좋고, 어떤 것은 나쁘다고 말씀해주세요."}, {"i": 125, "k": "A", "t": "우선은 자전거도 실력이 서로 다르다 보니 잘 타는 친구하고 타면 더 잘 타져요. 그리고 당연히 못 타는 아이들이랑 타면 더 챙겨줘야 하는 그런 것들? 어쨌든 이게 혼자 하는 것보다는 어떠한 것들이든 둘이 하는 게 낫고.. 이런 것들이 있기 때문에 둘이서 힘들게 갔던 곳을 혼자서는 잘 안 가죠. 웬만하면.. 그런 사람들도 있어요. 혼자 가는 사람들도 있는데, 저 같은 경우는 같이 하려고 하는 편이고요."}, {"i": 126, "k": "S", "t": "ㄴ [pxd] 자전거 타면서 제일 좋았던 기억이 혹시 대표적인 에피소드가 있을까요?"}, {"i": 127, "k": "A", "t": "우선 자전거를 대마도에서도 탔었거든요. 배에 실어서 가서 탔었는데.. 우선은 한국에서만 타더라도, 내가 알던 한국이 아닌 거예요. 내가 알던 한국은 이런 게 없었던 것 같은데.. 겉으로만 어디 “부산 다녀왔어.” “대구 다녀왔어.” 이렇게 할 수 있는데 그 지역에서 자전거로 간다던지 투어라고 해서 간다던지 하면 자전거가 속도가 그렇게 빠르지는 않으니까 여러 가지를 많이 보게 되면서 느끼는 것들이 많은 것 같아요."}, {"i": 128, "k": "S", "t": "ㄴ [HMC] 일종의 도로를 주행하시는 건데, 위험 부담이라던지, 요새는 많이 바이크족들을 배려하긴 하는데요."}, {"i": 129, "k": "A", "t": "네. 우선은 정책적으로도 그런 것들이 있으니까 그러긴 하는데요. 혼자 타면 그런 것들이 위험하거든요. 아까 물어보셨었는데 사고 났을 때 혼자 있으면 되게 위험하니까 같이 타는 경우도 있고.. 요즘에는 그래도 인식이 많이 변화가 되는 추세여서 원래는 도로라는 자체가 자동차의 전유물이었는데 유럽이라던지 다른 나라 같은 경우는 ‘과연 누가 주인이냐..’. 우선은 보행자가 우선인 것이 맞잖아요. 그리고 자전거도 있고.. 누구나 사용할 수 있는 도로인데 우리나라에서만 인식이 있는 것 같아요. 요즘에는 그래도 흔히 말하는 ‘자덕’들이 생기면서 많이 바뀌고 있는 것 같습니다."}, {"i": 130, "k": "A", "t": "그리고 또 안 좋은 게 어느 사이트 같은 데서는 ‘자라니’라고도 부르거든요. 그게 고라니 막 튀어나오니까.. 자전거를 타는 사람들이 갑자기 튀어나와서. 고라니와 비유하는 단어로 ‘자라니’라고 불리는 경우도 있어요."}, {"i": 131, "k": "S", "t": "ㄴ [HMC] 폄하하는 단어죠?"}, {"i": 132, "k": "A", "t": "그쵸. 저는 항상 동호회 사람들도 마찬가지고.. ‘자덕’은 돼도 ‘자라니’는 되지 말자고 이런 식으로.. 신호도 다 지키고 자전거가 또 좌회전을 하면 안 되거든요."}, {"i": 133, "k": "S", "t": "ㄴ [pxd] 자동차와 관련해서 싣고 갈 때 말고요, 자전거를 타고 갈 때 자동차 때문에 위협을 많이 느끼는 것들이 있을 텐데 차도 사용하시니깐요. 자전거를 타고 가실 때 자동차에 이런 기능이 있어서 자전거인들한테. 또 자전거인들은 아니지만 그런 위험 상황을 좀 방어할 수 있거나 하는 것이 있나요?"}, {"i": 134, "k": "S", "t": "ㄴ [pxd] 자전거를 탈 때 차가 이랬으면 좋겠다는 것이 있을 수 있을 것 같아요."}, {"i": 135, "k": "A", "t": "아무래도 저희는 항상 신호를 다 하게 돼요. 자전거를 타는 사람들은 그런데 차는 속도가 빠르다 보니 그 신호를 우리가 알기 힘들거든요. 자전거 같은 경우에 도로에서 탈 때 후미등이라던지 이런 것들을 하게 되는데.. 그런 식으로 우리가 하더라도 차들은 하지 않으니까 우리가 하기가 쉽지가 않은 거죠. 그리고 또 위협 운전을 많이 하는 편인 거같아요. 택시라든지 버스 같은.. 대형 차들이 또 그런 것들이 있고요. "}, {"i": 136, "k": "A", "t": "그래서 자전거 타는 사람들은, 저도 그렇고 블랙박스가 있거든요. 자전거에. 그게 자전거 탈 때 속도라든지 GPS도 돼서.. 그런 것들이 나오는 점도 있지만 우선은 그게 목적이 약간 위협 운전을 한다거나 그런 차들을 바로.. 어떤 사람들은 그냥 바로 칩 빼서 경찰서 가서 신고하는 사람들도 있어요. 우선은 저희들 말고 차들의 인식이.. 자전거를 모르는 사람도 많이 있기 때문에.. 그게 제일 문제인 것 같아요. 다른 기능적인 것을 떠나서요."}, {"i": 137, "k": "S", "t": "ㄴ [pxd] 자전거 말고 스노우 보드도 많이 하셨는데, 차를 바꾸고 스노우보드를 가신 적이 있으세요?"}, {"i": 138, "k": "A", "t": "네. 있습니다."}, {"i": 139, "k": "S", "t": "ㄴ [pxd] 그때는 어떤 식으로 수납을 하셨나요?"}, {"i": 140, "k": "A", "t": "그런데 스노우 보드는 자전거보단 훨씬 편하죠. 부피도 좀 더 작은 편이고, 커버도 있잖아요. 그리고 막 놔도.."}, {"i": 141, "k": "S", "t": "ㄴ [pxd] 또 시트를 접고 그냥 놓으시나요?"}, {"i": 142, "k": "A", "t": "네. 맞습니다."}, {"i": 143, "k": "S", "t": "ㄴ [pxd] 그러면 이제 자전거 타고 갈 때 좀 더 다양한 준비물들이 있을 것 같은데요. 옷 같은 것도 어떤 식으로 준비해서 수납을 하시고, 먹을 것 같은 것도 수납을 하실 것 같은데요?"}, {"i": 144, "k": "A", "t": "먹을 거는 잘 안 하고요. 옷은 바로 자전거를 타는 경우도 있어서 그냥 입고 갈 때도 있고, 아니면 그냥 가방에 넣는데 부피가 되게 작아요. 일반 옷보다 되게 작기 때문에.. 얇고 이래서.. 접으면 요만해지니까. 그런거 말고는 자전거를 타면서 사용하는 액세서리가 헬멧이나 장갑, 신발 이런 것들이 있는데 그런 것들을.. "}, {"i": 145, "k": "A", "t": "그런데 그런 것들도 부피가 많이 차지하지 않기 때문에 자전거를 다 넣고, 남는 부분에다가 가방이나 다른 물건들을 싣는 편이죠. 자전거가 우선이고."}, {"i": 146, "k": "S", "t": "ㄴ [pxd] 자전거가 우선이니깐, 모닝 때나 스포티지 때도 초반에는 엄청 더 신경을 써서 넣다가 쓰다 보면은 무덤덤해지는 면들도 생기잖아요. 그렇게 변했던 것이 있으신가요? "}, {"i": 147, "k": "A", "t": "차에서 무덤덤해지는 거가 있어요. 차에도 모닝 같은 경우에 신 차는 아니었지만 차 더러워지면 안 되는데.. 하면서 넣었던 것들이 이제는 자전거가 우선이 되는 거죠. 차는 ‘뭐 더러워지면 어때.’ 이런 느낌이고.. 지금 차도 마찬가지로 처음에는 ‘살살 넣어야지.’ 하다가 지금은 자전거가 우선으로.. 차보다는 자전거가 우선이에요."}, {"i": 148, "k": "S", "t": "ㄴ [pxd] 자전거를 수납하실 때 끝나고 자전거가 좀 더러워질 수도 있고 흙먼지 같은 것이 있을 수 있는데 그럴 때 차에는 크게 신경을 안 쓰고 넣으시는 편인가요?"}, {"i": 149, "k": "A", "t": "네. 저는 신경을.. 저는 원래 그런 것을 잘 신경 쓰는 편이 아닌데요. 그런 신경을 쓰는 사람들도 있는데 저는 그냥 넣습니다. 어차피 더러워지면 세차 한번 맡기면 되니까.."}, {"i": 150, "k": "S", "t": "ㄴ [pxd] 차에서는 폴딩도 되고, 전체적으로 더러워져도 되는 재질이긴 한데, 그래도 어디에는 안 묻혀야지 하면서 신경 쓰시는 것이 있으신가요?"}, {"i": 151, "k": "A", "t": "그렇게 따진다면 시트죠. 그런데 접기 때문에 시트에 묻을 일은 거의 없고.. 이게 바퀴를 빼게 되면 포크라고 해서 자전거 앞 부분 있잖아요. 그게 끝 쪽은 쇠로 되어 있어서 그래서 그게 내장재를 손상시키는 경우가 제일 많거든요. 제일 가두리에 있으니까.. 그거 말고는 따로 하지 않아도 이미 자동차에도 부직포 같은 재질로 다 되어있고 하니까 특별히 신경 쓰진 않습니다."}, {"i": 152, "k": "S", "t": "ㄴ [pxd] 포크 같은 것이 내장재를 손상시킬까봐 주의하시는 점은 어떻게 주의를 하시나요?"}, {"i": 153, "k": "A", "t": "돗자리를 가지고 다니는데, 그거를 사용해서 닿아도 상처만 안나게끔 하는 편이에요. 그런데 그 전에 최대한 안 닿게 해놓죠. 그리고 차에 또 있는 것이 신발이랑, 운동화 그리고 유도복이 있는데 그냥 있는 거를 이용해서 방어를 한다고 해야하나? "}, {"i": 154, "k": "S", "t": "ㄴ [HMC] 자전거가 최대한 보호되게요. 차는 뭐 긁혀도 괜찮은 거네요."}, {"i": 155, "k": "A", "t": "네. 거의 그렇습니다. 포크가 손상이 되면 안 되기 때문에 그거를 보호하는 거고. 내장재보다는요. 상처가 나긴 하지만.."}, {"i": 156, "k": "S", "t": "ㄴ [pxd] 수납하시거나 고정할 때 자동차의 고정하는 벨트라던지, 어떻게 자동차가 변형되어서 자전거를 수납하기 좋게 할 수 있다고 하면 어떤 식으로 차가 도와줬으면 좋겠어요?"}, {"i": 157, "k": "A", "t": "스포티지가 아무래도 일반 승용차보다는 전고가 높고 이 밑에 바퀴가 들어 있잖아요. 그거를 빼서 변형시켜서 자전거를 거치하는 사람들이 있어요. 스페어 타이어를 빼고, 자전거가 옆으로 누우면 낮지만 세우면 높잖아요. 씨포스트라고 해서 안장이 있고.. 그런데 그거를 빼서 실으면 여러대를 더 실을 수가 있거든요. 안전하게."}, {"i": 158, "k": "S", "t": "ㄴ [pxd] 세워서요?"}, {"i": 159, "k": "A", "t": "네. 세워서 넣게 되면요. 어떻게 보면 자전거를 이 상단에다가 루프 랙 해서 거치하는 것을 안에다가 하는 상황이 되는 거죠. 그렇게 하고 싶은데 차라리.. 그렇게는 어떻게 하는지 막막하니까 안 하는 경우인데.. 그런 것들이 추가적으로 있으면 사용하는 데에.."}, {"i": 160, "k": "S", "t": "ㄴ [pxd] 스페어 타이어 있는 공간에 어떻게든 자전거가 딱 한 대라도 세워서 보관할 수 있도록이요. "}, {"i": 161, "k": "A", "t": "네. 이렇게 세로로 세우는 것처럼 바퀴 다 뺴고 넣으면 되게 많이 여러 대를 또 세울 수가 있을 것 아니에요. 폭이 있으니까. 그래서 그런 것들이 있으면 좋겠다는 생각을 했고요. "}, {"i": 162, "k": "A", "t": "어떤 사람들은 이 스페어 타이어 하면은 접고.. 하는게 있잖아요. 트렁크를 열면 이게 접었다 뺐다 하면서 이 안에 스페어 타이어가 있는데.. 그거를 아예 제거를 하고, 스페어 타이어 다 뺴서 세로로 세우는 경우도 있고요."}, {"i": 163, "k": "S", "t": "ㄴ [pxd] 투어 같은 것 가시면 멀리 갔다 오실 경우도 있잖아요. 운동을 하고 끝나고 먼 거리를 돌아오신 경우도 있으실 것 같아요. 그래서 졸음운전 같은 것이 위험할 수도 있을 것 같은데요. 장거리 할 때 졸음운전을 방지하기 위해서 노력하시거나 아니면 차량의 크루즈 컨트롤을 사용하신 적이 있으신가요?"}, {"i": 164, "k": "A", "t": "지금 제 차에 크루즈 기능이 있긴 한데, 사실 제가 조작을 해야 하는 게 있잖아요. 일반 자율 주행 차가 아니기 때문에 당연히요. 크루즈를 사용하면 엑셀을 안 밟는 편함이 있긴 하지만 신경도 계속 써야 하기 때문에 만약에 그거를 안 하면 졸음이 올 때 더 졸릴 것 같아요. 그러면 사고에 더 큰 부담이 있을 것 같아서 그냥 안 쓰는 편이에요. 그냥 크루즈 켜봤다가 끄는.. 그 정도만 해봤고요."}, {"i": 165, "k": "S", "t": "ㄴ [pxd] 요즘 최신 차나 고급 차, 보급형 차에도 반 자율 주행처럼 앞에 차 있으면 멈춰주고 이런 기능이 있는 차가 있는데요, 추후에 차를 다시 구입하시면 그런 기능도 고려하시고 살 것 같으신가요?"}, {"i": 166, "k": "A", "t": "그것 때문에 사진 않을 것 같아요. 진짜로 안전한지는 아직 검증이 안 되어있기 때문에 지금 크루즈가 있어도 잘 안 쓰는데 그거 있다고 잘 쓰지는 않을 것 같아요. 차선 이탈하면 신호 울리고 이런 거는 있으면 당연히 좋기는 하겠지만 꼭 이런 것이 기준이 되지는 않을 것 같습니다."}, {"i": 167, "k": "S", "t": "ㄴ [pxd] 차로 멀리 가실 때나, 자전거도 어떻게 보면.. 시골같이. 오지 같은 곳에 주차를 많이 하시는데 선호하는 주차 공간이라던지 그런 것이 있으신가요?"}, {"i": 168, "k": "A", "t": "자전거를 탈 때 말고요?"}, {"i": 169, "k": "S", "t": "ㄴ [pxd] 자전거 타실 때요."}, {"i": 170, "k": "A", "t": "자전거 탈 때는 넓은 공간이 있는 데를 주로 선호하죠."}, {"i": 171, "k": "S", "t": "ㄴ [pxd] 굳이 피하거나 저런 데는 주차하지 말아야지 하는 곳도 있나요? 예를 들어서 자전거를 빼야 하니까 평행 주차는 안 하실 것 같고요."}, {"i": 172, "k": "A", "t": "아무래도 자전거를 타면 약간 시골 동네를 가게 돼서요. 그 곳의 군청이라던지.. 이런 데가 아무래도 주차 공간에 여유가 있어서 그런 데를 많이 이용을 하는 편이고요. 일반 주차장 같은 데는 잘 안 하는 편이에요. 왜냐하면 자전거를 타고 어느정도 이동을 할 수 있기 때문에 좀 멀어도 안전하고 공간에 여유가 있는 곳으로 주차를 하는 편입니다."}, {"i": 173, "k": "S", "t": "ㄴ [pxd] 자전거 때문에 말고, 차에 추가적으로 애프터 마켓, 튜닝이라기보다는 자동차 용품들 있잖아요. 부수적인 것들. 추가적으로 구매해서 다신 것이 있으신가요?"}, {"i": 174, "k": "A", "t": "아뇨. 없어요."}, {"i": 175, "k": "S", "t": "ㄴ [pxd] 핸드폰 거치대 같은 것도 안 해놓으셨나요?"}, {"i": 176, "k": "A", "t": "핸드폰 거치대도 안 했어요. 그냥 방향제 정도?"}, {"i": 177, "k": "S", "t": "ㄴ [pxd] 혹시 안 넣으신 이유가.. 지저분한 게 싫으셔서 인가요?"}, {"i": 178, "k": "A", "t": "네. 그런 거.. 제가 깨끗한 편은 아니긴 한데.. 그리고 어차피 차에 내비게이션 다 있고, 핸드폰 내비게이션도 쓰긴 하는데 그거를 보면서 다니지는 않거든요. 내비게이션도 원래 잘 안 키는 편이어서요."}, {"i": 179, "k": "S", "t": "ㄴ [pxd] 멀리 시골 같은 데를 가실 때는 어떤 내비게이션을 사용하세요?"}, {"i": 180, "k": "A", "t": "진짜 처음 가는 길이어서 멀리 가게 되면 시간이나 이런 것들을 볼 때는 두 가지를 다 켜요. 자동차 내비게이션 켜보고 핸드폰 내비게이션 켜보고 차이를 본 다음에 가는 편이고.. 그거는 좀 어쩔 때는 핸드폰 내비게이션 쓸 때도 있고, 꼭 어떤 것을 선호하고 그러지는 않는 거 같아요."}, {"i": 181, "k": "S", "t": "ㄴ [HMC] 자전거로 멀리 가실 때도 핸드폰 내비게이션을 쓰세요?"}, {"i": 182, "k": "A", "t": "아니요. 안 씁니다."}, {"i": 183, "k": "S", "t": "ㄴ [HMC] 그럴 때는 어떻게 가세요?"}, {"i": 184, "k": "A", "t": "우선 어느 정도 길을 보고 가고요. 길 코스가 있는데, 자전거에 또 우리가 트립 컴퓨터라고 할 만한 자전거 부품이 있어요. 가민이라는 회사에서 나오는 제품인데, 그게 어느 정도 내비게이션이 있어요. 그게 방향이나 지시는 하지 않지만 코스를 알려주고, 지도를 거기다 해놓으면 길이 다 나옵니다. 그래서 내비게이션으로 그걸 이용합니다. 거의 길 다 나온다고 보시면 됩니다."}, {"i": 185, "k": "S", "t": "ㄴ [HMC] 지난번에 부산 가실 때도 이용하셨나요?"}, {"i": 186, "k": "A", "t": "네."}, {"i": 187, "k": "S", "t": "ㄴ [HMC] 모르는 길이 되게 많잖아요, 국도 길이라던지.. 경로가 되게 다양할텐데 자전거 주행에 더 좋은 길이 있을테고요."}, {"i": 188, "k": "A", "t": "부산까지는 자전거 도로가 계속 이어져 있어서요. 그게 이명박 정부 때 만들어진 자전거 도로.. 아라메길에서 부산 낙동 하굿둑이라고 해야 하나? 거기까지 자전거 길이 다 이어지게 되어있거든요. 그거의 표지판도 되게 잘 되어 있어요. 그래서 그거 보고 갔습니다. 거의 약간 제가 계획을 많이 짜는 편이 아니어서.. 그냥 그거 보고 갔습니다."}, {"i": 189, "k": "S", "t": "ㄴ [pxd] 그럴 때 숙소는 어떻게 정하시나요?"}, {"i": 190, "k": "A", "t": "그냥 가는 길에.. 해 지려고 하면 이제 숙소 찾아서 들어가서.. 다 있더라고요."}, {"i": 191, "k": "S", "t": "ㄴ [HMC] 그러면 자전거를 가지고 있다가 방 안으로 가지고 가는거네요."}, {"i": 192, "k": "A", "t": "네. 맞습니다. 다 이야기해서 안 되면 그 방 안 쓰고요."}, {"i": 193, "k": "S", "t": "ㄴ [HMC] 아, 그러면 일반적인 도로로 부산까지 가시는 것이 아니겠네요?"}, {"i": 194, "k": "A", "t": "네. 자전거 길이 있습니다. 차는 잘 안 다니는.. 그런데 중간에 문경새재 이화령.. 그쪽에는 구 도로.. 아까 말씀드렸듯이 잘 안 쓰는 구도로를 자전거길로 하는 경우가 많은데, 아무튼 그 자전거 길에 자전거가 꽤 있어요. 그래서 많이 보이기 때문에 차들도 함부로 그렇게 다니지는 않을 것 같아요."}, {"i": 195, "k": "S", "t": "ㄴ [HMC] 그러면 정말 차로는 못 보는 그런 풍경들이 보이겠네요."}, {"i": 196, "k": "A", "t": "네. 맞습니다. 낙동강 초입 쪽에는 진짜 이런 데가 있었나 하고.. 지금 4대강 때문에 그런지는 모르겠지만 약간 늪지대처럼 보이는 곳이 있는데, ‘이거는 동남아 가야 볼 수 있을 것 같은데..’ 이런 생각이 드는 곳도 있었고요. 이 차도로 가게 되면 차의 소음이나 이런 것 때문에 턱을 만들어 놓는 경우도 있잖아요. 그러면 시야가 가리기 때문에 그 너머는 잘 안 보이는데, 그런 길 위로 자전거 길이 나오는 경우가 있습니다. 그러면 양 옆으로 시야가 보이기 때문에 이 넘어서 ‘아, 저런 데는 저런 것이 있구나..’ 이런 것들이 보입니다."}, {"i": 197, "k": "S", "t": "ㄴ [pxd] 아까 졸음운전 이야기 나왔는데 졸릴 때는 차에서 어떻게 하세요?"}, {"i": 198, "k": "A", "t": "졸릴 때는 완력기 있잖아요? 그거를 많이 하는 편이고요."}, {"i": 199, "k": "S", "t": "ㄴ [pxd] 그거를 옆에 놔두시고요?"}, {"i": 200, "k": "A", "t": "네. 항상 가지고 다닙니다. 껌 씹고 이래봐야 소용없는 것 같고. 그걸로 죽을 때까지 하고요. 아니면 잠깐 쉬어가는 것이 제일이긴 한데 항상 쉴 수는 없어서.. 그럴 때는 완력이 많이 쓰고, 그전에 안 피곤하려고 커피나 에너지 드링크 마시고.. 그리고 전화는 하면 안 되는데.. 전화하고, 옆에 사람이랑 대화하는 경우도 있어요."}, {"i": 201, "k": "S", "t": "ㄴ [pxd] 차에서 장거리 운전 하실 때 여러 기능들이 있잖아요. 음악 듣는 것도 있고, 에어컨도 있고 한데.. 보통 어떻게 사용하시는 지 전체적으로 설명해주실 수 있나요?"}, {"i": 202, "k": "A", "t": "에어컨이나 히터 같은 경우에는 그냥 계절이 있으니까 시동 키면서 바로 틀고요. "}, {"i": 203, "k": "S", "t": "ㄴ [pxd] 오토로 쓰시나요?"}, {"i": 204, "k": "A", "t": "아뇨. 제일 로우나 제일 하이로요."}, {"i": 205, "k": "S", "t": "ㄴ [pxd] 혹시 오토로 안 쓰시는 이유가 있으신가요?"}, {"i": 206, "k": "A", "t": "지 멋대로 움직이는 것이 싫어서요. 제 마음대로 컨트롤 하고 싶어서.. 그런 것 같고, 통풍 시트도 같이 키거나 열선 같이 키게 되고요. 그러고서는 USB로 노래 넣잖아요. 그거를 제일 많이 해요."}, {"i": 207, "k": "S", "t": "ㄴ [pxd] 핸드폰으로는 안 하시고 USB로 하시는군요."}, {"i": 208, "k": "A", "t": "네."}, {"i": 209, "k": "S", "t": "ㄴ [pxd] USB를 선호하시는 이유가 무엇인가요?"}, {"i": 210, "k": "A", "t": "조작을 해야하잖아요. 핸드폰은. 그게 싫어서요. 핸드폰 조작을 안 해도 되니까 그것 때문에.."}, {"i": 211, "k": "S", "t": "ㄴ [pxd] 핸들에 있는 걸로 다음 곡으로 넘어가시고요?"}, {"i": 212, "k": "A", "t": "네. 그거는 핸들에 있는 걸로 하고요. 그렇게 하고, 내비게이션은 중간에 이용할 때도 있는데 거의 운전하기 전에 내비게이션 조작을 하고 이용하는 편입니다."}, {"i": 213, "k": "S", "t": "ㄴ [pxd] 혼자 운전하실 때랑 다른 분이 있고, 자전거도 있을 때 달라지는 점이 있나요? 운전 스타일이 달라질 수도 있고요. 좋은 게 있을 수도 있고, 싫은 것이 있을 수도 있고요."}, {"i": 214, "k": "A", "t": "혼자 운전하는 것이 아무래도 마음적으로 더 편하죠. 편하고, 옆에 있으면 좋은 거는 말동무를 한다거나 그런 것들 말고는.. 그냥 같이 가는 정도. 동행자가 있는 것 말고는 다른 것은 혼자 하는 것이 더 편한 것 같습니다."}, {"i": 215, "k": "S", "t": "ㄴ [pxd] 그러면 자전거를 가지고 자동차를 이용한다고 하셨을 때, 자전거 수납부터 출발까지 어떻게 하시는지 순서대로 말씀해주실 수 있나요?"}, {"i": 216, "k": "A", "t": "우선은 자전거를 잘 실을 수 있는 공간에 차를 그 전날 주차를 했다던가 그렇지 않은 공간이라면 차를 빼서 좀 편한데다가 옮겨놓고.. 그리고 트렁크를 열고 자전거를 넣죠. 그 다음에 나머지 여분의 악세서리 같은 것들을 추가적으로 넣고요."}, {"i": 217, "k": "S", "t": "ㄴ [pxd] 댁에서 자전거를 들고 내려오시나요?"}, {"i": 218, "k": "A", "t": "네. 자전거를 가지고 내려와서.. 지금은 많이 넣어봐서 이렇게 넣으면 되는 방식이 있는데 만약에 없다 하면 흔들림이 없는지 그런 것들을 어느 정도 체크를 하고, 차에 타서 출발을 합니다."}, {"i": 219, "k": "S", "t": "ㄴ [pxd] 차에 타서 출발하실 때는 어떤 식으로 조작을 해서 출발까지 하시는지 순서대로 설명해주세요."}, {"i": 220, "k": "A", "t": "차에 자전거 넣고 나서 시동 키고 바로 뒤에 넣고 바로 가고.."}, {"i": 221, "k": "S", "t": "ㄴ [pxd] 내비게이션 말고 따로 추가적으로 핸드폰에서 실행시키는 서비스 같은 것은 없으신가요?"}, {"i": 222, "k": "A", "t": "네. 없습니다. 거의.. 핸드폰으로는 뭐 안 해서요."}, {"i": 223, "k": "S", "t": "ㄴ [pxd] 주행 중에 자전거의 상태를 가끔씩 소리나면 확인을 하잖아요. 그럴 때 백미러로 확인을 하시나요? "}, {"i": 224, "k": "A", "t": "백미러는 아래가 안 보이고 뒤쪽 창문으로 되어 있으니까 거의 안 보이고요. 뒤로 돌아서 보는 편인 것 같아요."}, {"i": 225, "k": "S", "t": "ㄴ [pxd] 실을 때나 달 때 자전거 관련해서 제일 염려되는 거나 불편하신 것이 있으신가요? 아까 자전거 손상 말씀하셨는데 그런거 같은 것이 또 있을까요?"}, {"i": 226, "k": "A", "t": "아까는 한 대 자전거만 넣었을 때는 거의 그런 것이 없고요. 두 대 이상 실었을 때가 문제인데, 우선은 소리로 신경이 쓰이고요. 소리가 없으면 흔들림이 거의 없는거나 마찬가지기 때문에 소리가 안 나면 편하게 가는 편이에요. 소리가 제일.. "}, {"i": 227, "k": "S", "t": "ㄴ [pxd] 지금 것은 혹시 트렁크가 전동인가요?"}, {"i": 228, "k": "A", "t": "아뇨. 전동 아닙니다."}, {"i": 229, "k": "S", "t": "ㄴ [pxd] 다른 고급 차들 보면 에어 서스펜션 혼자 움직이는 것들도 있고 한데요, 그런 거에 대해서는 어떻게 생각하시나요?"}, {"i": 230, "k": "A", "t": "있으면 좋지만 없어도 자전거와는 상관이 없는 것 같아요. 왜냐하면 그게 저희 아버지 차에도 있는데 그걸 많이 써보지는 않았는데요. 그만큼 또 짐을 실어본 적이 없어서요. 그거를 사용을 해볼 때는.. 이게 중간에 만약에 물건이 있으면 멈추는지, 아니면 어느 정도 힘 이상은 들어가는 건지. 그거를 몰라서 만약에 자전거가 트렁크가 안 닫히게 되어 있는데 그거를 넣어버리면 안 되거든요. 그러면 자전거가 손상이 되니까.."}, {"i": 231, "k": "S", "t": "ㄴ [pxd] 아, 혹시나 자전거가 트렁크에 닿을 수도 있는 상황인데 강제로 하면 안되니까요."}, {"i": 232, "k": "A", "t": "네. 들어가면 안 되니까요. 그래서 닫을 때도 천천히 우선은 창문으로 보면서 닫다가 세개 탁 닫죠."}, {"i": 233, "k": "S", "t": "ㄴ [pxd] 지금은 닫으실 때 충분히 밀어 넣고 닫으시는 건가요? "}, {"i": 234, "k": "A", "t": "그렇죠. 어느 정도 라인을 알잖아요. 그런데 그거를 넘어서는 경우들이 가끔 있어요. 그래서 닫을 때 자전거가 좀 창문 안으로 움직인다하면 다시 조정을 하고.. 그렇습니다."}, {"i": 235, "k": "S", "t": "ㄴ [pxd] 그러면 이제 자동차에서 자전거를 수납하고 빼셨을 때 청소 같은 것을 하시잖아요. 청소 같은 것은 어떻게 하시나요?"}, {"i": 236, "k": "A", "t": "청소 안 해요."}, {"i": 237, "k": "S", "t": "ㄴ [pxd] 청소 안 하시면 세차 맡기시나요?"}, {"i": 238, "k": "A", "t": "네. 그리고 자전거가 비포장도로를 달리지 않기 때문에.. 제 자전거 같은 경우에는. 흙이 묻어나는 경우가 별로 없어요. 비 올 때 말고는.. 아니면 물 있는 데 아니고서는 흙먼지가 떨어지는 경우가 거의 없거든요. "}, {"i": 239, "k": "S", "t": "ㄴ [pxd] 비 올 때는 어떻게 하시나요?"}, {"i": 240, "k": "A", "t": "비 올 때는 우선 타고나면 이제 바퀴랑 이쪽에 자전거에 묻어 있는데.. 그렇게 타고 나서도.. 이 타고나면은, 어느 정도 떨어져 있기 때문에.. 그리고 자전거에 그냥 붙어 있거나. 그렇기 때문에 자전거를 넣는다고 해서 막 더러워 지지는 않아요."}, {"i": 241, "k": "S", "t": "ㄴ [pxd] 그러면 크게 물 튀길까봐 신경 쓰는 것 없이 그냥 똑같이.."}, {"i": 242, "k": "A", "t": "네네. 거의 그냥 동일하게 넣습니다."}, {"i": 243, "k": "S", "t": "ㄴ [pxd] 오지 같은 데 주차하실 때 여름이나 겨울에는 되게 덥거나 추워지잖아요. 그런 거를 대비해서 준비하시거나 아니면 그럴 때 어떤 식으로 하시고 출발하시는지요?"}, {"i": 244, "k": "A", "t": "겨울에 추운거는 뭐 어쩔 수 없고요. 여름에는 최대한 그늘에다가 세우려고 하는 편이죠. 그런데 나무 밑에 세우면 액이 떨어지잖아요. 그런게 창문에 붙으면 끈적거리니까 최대한 나무 밑에는 안 하지만 자리가 없으면 어쩔 수 없이 그냥 세우는 것 같아요."}, {"i": 245, "k": "S", "t": "ㄴ [pxd] 만약에 핸드폰 애플리케이션에서 자동차에 자동으로 공조를 하거나 이런 기능이 있으면 사용하실 것 같으세요?"}, {"i": 246, "k": "A", "t": "저는 약간 불안해가지고.."}, {"i": 247, "k": "S", "t": "ㄴ [pxd] 어떤 점이 불안하신가요?"}, {"i": 248, "k": "A", "t": "시동을 아무래도 켜야 하잖아요? 그런 것들.. 제가 없는데 시동이 켜져 있는 거 자체가 불안한 것 같아요."}, {"i": 249, "k": "S", "t": "ㄴ [pxd] ‘레저 활동을 할 때 내 자동차는 ~다’’라고 또 만약에 한 마디로 표현하신다면 어떻게 말씀하실 수 있을까요?"}, {"i": 250, "k": "A", "t": "도우미?"}, {"i": 251, "k": "S", "t": "ㄴ [pxd] 자전거를 더 잘 타기 위한.."}, {"i": 252, "k": "A", "t": "네. 좋은 곳으로 가기에 적합하게 만들어주는.."}, {"i": 253, "k": "Q", "t": "Q. [pxd] 저희가 다양한 상황이 적혀진 리스트를 가져왔어요. 만약에 이러한 여러 상황이 있을 때 특별히 이런 상황을 피하거나, 아니면 이 상황에서 사용하는 기능 또는 피해 가는 방법이 혹시 있으신지요? 아니면 노하우라든지요. 자전거를 싣고 산 길이나 오프로드로 가면 되게 많이 밀리잖아요? 이럴 때 어떤 식으로 운전을 하시는지 말씀해주시면 될 것 같아요. 크게 주의하는 것이 없으시면 넘어가도 되고요."}, {"i": 254, "k": "A", "t": "넘어 가는 게 다음 칸으로 넘어가면 되는 거죠? 오프로드는 가본 적이 없어요. 가본 적이 없고.. 경사로 때는 이게 경사로 올라가는 거는 상관이 없는데 내리막일 때는 엔진 브레이크를 저단으로 넣거나, 버튼이 있는데 그거를 한 번 써본 적이 있어요. 그런데 거부감이 너무 들어서.."}, {"i": 255, "k": "S", "t": "ㄴ [pxd] 그게 아마 경사로 밀림 방지 기능일텐데, 어떤 거부감이 드셨나요?"}, {"i": 256, "k": "A", "t": "제가 원래 첫 차를 스틱으로 탔었는데 그럴 때는 그냥 저단으로 넣고 가면 엔진의 고음 소리가.. 내가 알고, 쓰는데. 이거는 갑자기 막 했더니 좀 달랐던 것 같아요. 느낌이. 그거를 뭐라고 설명을 해야 할지는 모르겠는데.."}, {"i": 257, "k": "S", "t": "ㄴ [pxd] 익숙치 않은 느낌이라서요?"}, {"i": 258, "k": "A", "t": "네네. 그래서 차라리 그냥 오토여도 바꿀 수 있잖아요. 저단으로. 그냥 그거를 이용하는 편이고요."}, {"i": 259, "k": "S", "t": "ㄴ [pxd] 빗길 운전 시에 주의하시는 점이 있으신가요?"}, {"i": 260, "k": "A", "t": "감속 운행? "}, {"i": 261, "k": "S", "t": "ㄴ [pxd] 장거리 운전 중 피로는 말씀하셨던 것 같고, 야간 주행하실 때 주의하시는 점이 있으신가요? 아니면 야간 주행하실 때 위험했던 점이 있으신가요?"}, {"i": 262, "k": "A", "t": "야간에는 제가 운전하는 것보다 남 차를 더 많이 보는 것 같아요. 저 차가 어떻게 올 건지.."}, {"i": 263, "k": "S", "t": "ㄴ [pxd] 아까 말씀하신 루프 랙에 자전거를 올려 놓으면 사실 부피가 좀 걱정이 되잖아요. 그런 것 때문에 써놓은 건데, 지금 이런 거에 대한 불안감은 없으신거고요?"}, {"i": 264, "k": "A", "t": "네. 그렇죠."}, {"i": 265, "k": "S", "t": "ㄴ [pxd] 혹시 다른 차를 사용하실 때 이런 거에 대한 불안감을 가지신 적이 있으신가요?"}, {"i": 266, "k": "A", "t": "아까 전에 사진으로 보셨듯이.."}, {"i": 267, "k": "S", "t": "ㄴ [pxd] 네, 스타렉스."}, {"i": 268, "k": "A", "t": "스타렉스 같은 경우에는 그렇게 실으면 전고가 되게 높아지거든요. 그러니까 먼저 다른 차가 앞에 가서.. 그런 것들이 있으지 모르니까요. 낮은 터널이라든지. 그런 데를 다른 차가 먼저 가서 그런 일이 있으면 연락을 뒤의 차한테 한다던가.."}, {"i": 269, "k": "S", "t": "ㄴ [pxd] 그러면 만약에 그런 도로가 있으면 피해가나요?"}, {"i": 270, "k": "A", "t": "그렇죠. 그런데 그런 도로를 제가 만나본 적은 없어요. 그런 식으로 연락하자고 이야기는 하고요. "}, {"i": 271, "k": "S", "t": "ㄴ [pxd] 저희가 자전거 말고 다른 사용자도 있어서 도하같은 것도 써놨는데 이런 것 빼고 만약에 자전거 싣고 가다 사고라든지 돌발 상황 같은 것이 있으신 적이 있으세요?"}, {"i": 272, "k": "A", "t": "그런 적은 없었는데.. 그냥 안전하게. 더 안전하게 가기 때문에.. 그렇게 가는 경우에는, 그러니까 이런 일이 생기려면 모르는 길을 가는 경우인데 그런 일은 거의 다른 사람들이랑 같이 가니까.. 더 옆에 다른 동행자가 있고 여러 대의 자전거가 있고 하니까 최대한 안전하게 가죠."}, {"i": 273, "k": "S", "t": "ㄴ [pxd] 트렁크 수납 정리를 자전거 위주로 하신다고 하셨는데, 전체적으로 수납 정리하는 룰을 설명하신다면 ‘자전거의 안전’ 이렇게 설명할 수도 있겠네요."}, {"i": 274, "k": "A", "t": "네네. 맞습니다. 자전거의 안전.. 그러니까 트렁크에 또 자전거 말고 다른 것들이 실려 있는데, 그런 것들을 이용해서 자전거를 또 보호하는.. "}, {"i": 275, "k": "S", "t": "ㄴ [pxd] 아까 말씀해주신 유도복이나 돗자리, 요가 매트 말고도 또 어떤게 혹시 있나요?"}, {"i": 276, "k": "A", "t": "신발? 슬리퍼? 이런 것들을 이용해서 닿는 면이 없도록 해요. 서로 닿는 면이.."}, {"i": 277, "k": "S", "t": "ㄴ [pxd] 그리고 이제 소지품 같은 것, 선글라스나 차내에 자잘한 소지품들이 있잖아요. 그런 것들은 어떤 식으로 수납 하나요?"}, {"i": 278, "k": "A", "t": "우선은 글로브 박스라고 하나요? 그런 쪽에다가 수납을 하고 여기.."}, {"i": 279, "k": "S", "t": "ㄴ [pxd] 콘솔 박스요."}, {"i": 280, "k": "A", "t": "네. 콘솔 박스에도 넣고, 그리고 선글라스는 이쪽에.. 여기다가 넣고요."}, {"i": 281, "k": "S", "t": "ㄴ [pxd] 혹시 레저 관련해서 따로 조그만 소지품을 추가적으로 따로 놔두시거나 이런게 있으신가요?"}, {"i": 282, "k": "A", "t": "따로 넣지는 않아요. 레저를 할 때는 그 때마다 가져가죠."}, {"i": 283, "k": "S", "t": "ㄴ [pxd] 저희가 아까 초반에 안 여쭤봤는데, 레저를 할 때 가져가는 소지품은 작은 거랑, 옷이랑, 신발. 그리고 또 어떤 게 있나요?"}, {"i": 284, "k": "A", "t": "헬멧? 장갑? 그거 말고는 따로 없는 것 같은데.. "}, {"i": 285, "k": "S", "t": "ㄴ [pxd] 의류 같은 것 평소에 보관하세요?"}, {"i": 286, "k": "A", "t": "아까 말씀드렸듯이 유도복 말고는 따로 가지고 다니지는 않습니다. 아, 그날그날에 맞춰서 옷을 갈아입어야 하면 그때 가져가고요. 계속 보관하고 있지는 않아요"}, {"i": 287, "k": "S", "t": "ㄴ [pxd] 그러면 만약에 장거리로 자전거 투어를 가셨을 때 옷에 땀이 많이 젖잖아요. "}, {"i": 288, "k": "A", "t": "네."}, {"i": 289, "k": "S", "t": "ㄴ [pxd] 그거를 벗어서 갈아 입으시고요?"}, {"i": 290, "k": "A", "t": "자전거 옷이잖아요. 자전거 탈 때는 자전거 옷 입으니까, 자전거 안 탈 때는 평상복을 가지고 가죠."}, {"i": 291, "k": "S", "t": "ㄴ [pxd] 그러면 어디서 갈아입으세요?"}, {"i": 292, "k": "A", "t": "화장실에서 갈아입을 때도 있고요. 차 안에서 갈아입을 때도 있습니다. "}, {"i": 293, "k": "S", "t": "ㄴ [pxd] 차 안에서 갈아입으실 때 불편하신 점이나 신경 써서 하시는 노하우 같은 것들이 있으신가요?"}, {"i": 294, "k": "A", "t": "그래도 썬팅이 좀 되어있어서요. 사람들이 막 이렇게 쳐다보지 않는 이상 잘 안 보이고요. 어느 정도 사람들이 많이 다니는 곳에 주차는 하지 않기 때문에.. 아까 말씀드렸듯이 조금 떨어진 곳에다 주차하고.. 굳이 사람들이 막 오지 않으니까 어느 정도 지나다니는 것 보고 없으면 그냥 차 안에서 갈아입고요."}, {"i": 295, "k": "S", "t": "ㄴ [pxd] 입은 옷도 그냥 가방에 넣으시나요?"}, {"i": 296, "k": "A", "t": "그렇죠. 차에 그냥 던져놔요. 가방에는 안 넣습니다."}, {"i": 297, "k": "S", "t": "ㄴ [pxd] 흙먼지 같은 것은 세차를 아예 맡기시나요?"}, {"i": 298, "k": "A", "t": "제가 따로 하지는 않고 세차할 주기가 되면 같이 맡겨서 세차를 합니다."}, {"i": 299, "k": "S", "t": "ㄴ [pxd] 평소에 쓰레기 같은 것이 좀 나오나요?"}, {"i": 300, "k": "A", "t": "그럴 때만 그냥 쓰레기만 버리는데.. 큰 쓰레기."}, {"i": 301, "k": "S", "t": "ㄴ [pxd] 좌석 청소도 자주 안 하시고요."}, {"i": 302, "k": "A", "t": "안 합니다."}, {"i": 303, "k": "S", "t": "ㄴ [pxd] 그러면 이제 여러 개 자동차 기능들이 있는데요, 써보고 싶은 기능이나 지금 있는데 안 쓰는 기능 같은 것들이 있으시면 말씀해주세요. 아까 크루즈 컨트롤 같은 것은 어댑티브는 아니겠지만 지금 현재 있는 크루즈 컨트롤은 자기가 속도를 신경 써야 해서 안 쓴다고 하셨는데요."}, {"i": 304, "k": "A", "t": "그게 만약에 편하면.. 다른 좋은 차들 같은 경우에는 어떤.. ‘기사 없어도 되겠네.’라고 할텐데.. 제 생각에는 그렇게 되면 운전자가 피곤할 때 더 졸음이 올 것 같아요. 그게 또 위험할 것 같고요. 기능?"}, {"i": 305, "k": "S", "t": "ㄴ [pxd] 지금 차에 선루프가 있나요?"}, {"i": 306, "k": "A", "t": "네. 있습니다."}, {"i": 307, "k": "S", "t": "ㄴ [pxd] 선루프 자주 사용하세요?"}, {"i": 308, "k": "A", "t": "요즘 미세 먼지가 많아서요. 그래도 가끔 쓰는데.. 날 좋을 때? 그럴 때. 그런데 선루프를 열면 바람 들어오는 게 있잖아요. 그게 약간 좀 같이 바뀌는 게 좋은 건지.. 같이 바뀌더라고요. 그게 과연 좋은 건지 의문이예요."}, {"i": 309, "k": "S", "t": "ㄴ [pxd] 같이 바뀐다는 것이 어떤 의미인가요?"}, {"i": 310, "k": "A", "t": "외부에서 바람이 들어오는 걸로 바뀌더라고요. 설정이. 그래서 가끔 제가 다시 내부로 바꾸는 경우가 있거든요. 그건 사람마다 취향 차이인 것 같아서.."}, {"i": 311, "k": "S", "t": "ㄴ [pxd] 이것은 있는거죠. 경사로 밀림 방지.. 그러니까 올라갈 때 뒤로 밀리거나 그런 것을 방지해주는 기능이요."}, {"i": 312, "k": "A", "t": "아, 그게 그건가? 버튼이 있긴 한데 정확히.. 내리막에서 하는 건지.. 그게 내리막에서만 써봤거든요. 오르막에서는 안 써봤어요. 그런데 어느 정도 차가 힘이 있으니까 잘 안 내려가긴 하는 것 같아요. 뒤로. 그렇게 그런 적이 없어서.."}, {"i": 313, "k": "S", "t": "ㄴ [pxd] 급한 오르막이나 급한 내리막에서는 자전거가 움직일 수도 있잖아요. 그럴 때는 어떻게 신경을 쓰세요?"}, {"i": 314, "k": "A", "t": "저속으로 주행해요. "}, {"i": 315, "k": "S", "t": "ㄴ [pxd] 요즘에 긴급 제동 시스템이나 위험할 때 갑자기 멈춰주는 기능 같은 게 있는데 이런 것은 어떻게 생각하세요?"}, {"i": 316, "k": "A", "t": "이런 것은 있으면 좋을 것 같아요. 제가 판단하기 전에 멈춰주면 좋죠. "}, {"i": 317, "k": "S", "t": "ㄴ [pxd] 앞쪽에 말씀하신 거랑 비교해서, 개입해서 지켜보고 있어야 하고 내가 실행시킨 다음에 그래도 집중을 계속해야 하는 기능들이 있고, 자동적으로 실행시켜주는 기능들이 있는데 자동적으로 실행시켜주는 기능들을 선호하시나요?"}, {"i": 318, "k": "A", "t": "그렇죠. 있으면은 좋은 거죠. 없는 것 보다는 있는 게 낫고."}, {"i": 319, "k": "S", "t": "ㄴ [pxd] 그러면 사각 지대 알려주는 불빛 같은 것이 요즘에 많이 나오는데 지금 차에도 그게 있나요?"}, {"i": 320, "k": "A", "t": "불빛이요? 소리나고? 네. 그거는 있습니다."}, {"i": 321, "k": "S", "t": "ㄴ [pxd] 그거는 어떠세요?"}, {"i": 322, "k": "A", "t": "그건 꺼놓고 써요."}, {"i": 323, "k": "S", "t": "ㄴ [pxd] 왜 꺼놓고 쓰세요?"}, {"i": 324, "k": "A", "t": "소리가.. 저를 신경 쓰게 만들어서요. 사이드 미러, 백미러로 보면서 제가 판단해서 들어가는데 그 판단할 때 소리가 나니까 그게 싫더라고요. 그래서 내비게이션도 소리 다 줄여놨어요. 저 같은 사람이.. 이게 취향 차이 같아요."}, {"i": 325, "k": "S", "t": "ㄴ [pxd] 후방 카메라가 있잖아요. 그런 것 쓰실 때 불편하신 점이 있으신가요?"}, {"i": 326, "k": "A", "t": "제가 다른 차들도 많이 봤는데 이거 되게 괜찮더라고요. 선도 잘 나오고.. 그거에 맞추면 잘 되는데 저는 원래 사이드 미러 보고 주차 하는 편이어서.. 그것도 보면서, 사이드 미러 다 보는 편입니다. 그런데 그 카메라만 봤을 때 되게 성능이 많이 좋아진 것 같다고 생각했어요."}, {"i": 327, "k": "S", "t": "ㄴ [pxd] 자전거 같은 것 실으실 때 밤에는 내부 조명을 켜야 하잖아요. 항상 문 열면 오토로 틀게 해놓으신 거예요?"}, {"i": 328, "k": "A", "t": "아뇨. 제가 키고 싶을 때만.."}, {"i": 329, "k": "S", "t": "ㄴ [pxd] 그럼 자전거 넣을 때는 어떻게 키세요?"}, {"i": 330, "k": "A", "t": "밤에 넣을 때 되게 어두운 데에 있는 경우가 별로 없었고요. 키게 되면 전부 다 켜서.. 전체 다 키는.. "}, {"i": 331, "k": "S", "t": "ㄴ [pxd] 앞에 가서 키시고 뒤로 와서요. "}, {"i": 332, "k": "A", "t": "네."}, {"i": 333, "k": "S", "t": "ㄴ [pxd] 그러면 폴딩 같은 것도 하실 때 뒤에서 폴딩하세요? 아니면 앞에서 폴딩하세요? 지금 항상 되어있다고 하셨는데, 그래도 뒷자리 열고 거기서 폴딩하신 다음에 뒤로 가서 자전거를 놓으시는 편이세요?"}, {"i": 334, "k": "A", "t": "그게 2열 이라고 하죠? 2열 쪽에 문을 열어야지 옆에 있더라고요. 그래서 그걸로 쓰고 있어요. "}, {"i": 335, "k": "S", "t": "ㄴ [pxd] 만약에 시트가 펴진 상태일 때 자전거를 실으시면은, 뒤 문을 열어서 폴딩을 하고요?"}, {"i": 336, "k": "A", "t": "네. 그렇죠."}, {"i": 337, "k": "S", "t": "ㄴ [pxd] 그리고 다시 뒤로 와서 자전거를 들고 놓으시는 거군요."}, {"i": 338, "k": "A", "t": "네네. 맞습니다."}, {"i": 339, "k": "S", "t": "ㄴ [pxd] 예를 들어서 뒤에서 바로 접는 기능이 있는 차들도 있는데 그런 기능이 있으면 어떨 것 같으세요?"}, {"i": 340, "k": "A", "t": "그러면은 매우 좋죠."}, {"i": 341, "k": "S", "t": "ㄴ [pxd] 그런데 지금은 없으니까 그냥 쓰시는 거네요. "}, {"i": 342, "k": "A", "t": "그거를 확인을.. 없는 것 같은데요. 제 차에는? 그거를 확인을 해보지는 않았어요. 그냥 그거 있는거로 알고 있어서 그거로만 할 생각을 했지.. 네. 없는 것 같은데.."}, {"i": 343, "k": "S", "t": "ㄴ [pxd] 자전거 넣으실 때 말고 평소에 트렁크에 고정하려고 그물 같은 것을 많이 해놓잖아요. 짐 같은 것 움직이지 말라고.. 혹시 그렇게 해놓으신 것이 있으신가요?"}, {"i": 344, "k": "A", "t": "아니요. 없어요. 뒷좌석 2열에 가운데 안전벨트 하기 위해서 선이 있잖아요. 천장에서 이렇게 내려오는.."}, {"i": 345, "k": "S", "t": "ㄴ [pxd] 네."}, {"i": 346, "k": "A", "t": "그 선이 약간 불편할 때도 있어요. "}, {"i": 347, "k": "S", "t": "ㄴ [pxd] 어떤 점이 불편하신가요?"}, {"i": 348, "k": "A", "t": "자전거 실을 때 선이 이렇게 내려와 있으니까.. 그런데 불편하면서도 뭐 고정할 때 그거를 이용할 때도 있고요."}, {"i": 349, "k": "S", "t": "ㄴ [pxd] 그러면은 봤을 때는 들어가 있는데 필요할 때는 쓸 수 있게 튀어나오고."}, {"i": 350, "k": "A", "t": "네. 넣을 때는 좀 불편할 때 뭐 고정할 때는 가끔 그걸 이용하는 편이에요."}, {"i": 351, "k": "S", "t": "ㄴ [pxd] 어떤 식으로 이용하세요?"}, {"i": 352, "k": "A", "t": "예를 들면 이렇게 선이 있다고 치면 그 밑으로 자전거를 이렇게 넣거든요. 그 위에 다른 거를 휠을 올리거나 이럴 때 어느 정도 힘이 있으니까 그런 거를 지지해주는.. 그런 걸로 이용하는 편이에요."}, {"i": 353, "k": "S", "t": "ㄴ [pxd]  카고 스크린이라고 2열 뒤에 헤드레스트 해서 넣은 다음에, 트렁크 짐 가리기 위해서 쭉 피는 스크린 같은 것이 있잖아요? 지금은 그게 없으신건데, 사실 때부터 없으셨나요?"}, {"i": 354, "k": "A", "t": "네. 없었던 것 같은데."}, {"i": 355, "k": "S", "t": "ㄴ [pxd] 자전거 타고 나가실 때나 출퇴근하셨을 때 차에서 대기하는 시간이 있을 수 있잖아요. 차에서 대기한다던지, 아니면 다른 팀을 기다린다던지,그럴 때 차에서 어떻게 기다리세요?"}, {"i": 356, "k": "A", "t": "자전거를 실어 놓으면 1열이 다 이렇게 젖히지를 못 하거든요. 그래서 그냥 앉아서 기다리는 편이고요. 그리고 그 제 차가 전동 시트라고 해야 하나? 그 시트인데.. 너무 느려서. 조수석은 전동 시트가 아니에요. 그래서 자전거가 없다 치면은 조수석으로 옆으로 가서 눕히는 거를 사용해요. 빨리 넘어가고 싶어서.. 이게 세세한 조작은 좋은데, 확 넘어갈 때는 좀 느려서요."}, {"i": 357, "k": "S", "t": "ㄴ [pxd] 자전거를 그러면 운전석 뒤 쪽에 실으시나요?"}, {"i": 358, "k": "A", "t": "약간 사선으로 넣는 편이에요."}, {"i": 359, "k": "S", "t": "ㄴ [pxd] 폴딩은 두 개 다 되어있는.. 뒤 쪽 좌석은 다 폴딩 되어 있는 건가요? "}, {"i": 360, "k": "A", "t": "네. 지금은 다 되어있고요. 한 쪽으로 한다면 두 개로 나누어져 있는데.. 작은 것이 있고, 두 좌석으로 나눠져 있는 게 있는데 두 좌석 쪽을 접죠. 한 좌석만 접으면 안 돼가지고.. 안 들어가서.."}, {"i": 361, "k": "S", "t": "ㄴ [pxd] 평소에 대기하실 때는 뭘 하고 계시나요? 핸드폰을 한다든지 음악을 듣는다든지 아까처럼 혼자 누워서 대기한다고 치면요."}, {"i": 362, "k": "A", "t": "누워서 핸드폰을 보죠. 짧게 기다리면 시동을 켜놓는데, 짧게 기다리는 게 아니라면 굳이 시동을 안 켜놓기 때문에 음악도 뭐 안 듣는 편이고요. 엔진 돌아가잖아요. 그럴 때, 엔진이 안 돌아갈 때 전자 계통을 쓰질 않는 편이어서.. 배터리 방전도 있고 해서요. 그냥 시동 키지 않는 이상 아예 안 써요."}, {"i": 363, "k": "S", "t": "ㄴ [pxd] 블랙박스 다셨나요?"}, {"i": 364, "k": "A", "t": "네."}, {"i": 365, "k": "S", "t": "ㄴ [pxd] 블랙박스 말고 다른 전자 기기 같은 거를 차에 추가적으로 설치하거나 가끔 사용하려고 시가잭을 설치하셨나요?"}, {"i": 366, "k": "A", "t": "핸드폰 충전 말고는 안 씁니다."}, {"i": 367, "k": "S", "t": "ㄴ [pxd] 그러면 이제 마지막 질문을 드리려고 하는데요. 자전거를 자동차로 이용할 때 제일 불편한 점을 한 가지 꼽으라고 하면 어떤 것을 꼽으실 건가요? 기능이 될 수도 있고, 행동이 될 수도 있고 아니면 수납 방법이 될 수도 있고.. 제일 불편한 점 하나를 말씀해주시면 됩니다. 불편한 점 아니고 바라는 점을 말씀해주셔도 돼요."}, {"i": 369, "k": "A", "t": "제가 뭐라고 하지? 시트 부분에 헤드 쪽.."}, {"i": 370, "k": "S", "t": "ㄴ [pxd] 헤드레스트요."}, {"i": 371, "k": "A", "t": "그게 위아래로는 움직이지만 앞뒤로는 안 움직이더라고요. 아무래도 운전을 하다 보니 시트에 관련된 것이 제일 큰 것 같아요. 그게 좀 더 편했으면 하는.."}, {"i": 372, "k": "S", "t": "ㄴ [pxd] 앞뒤로 움직이면 어떤 식으로 활용을 하실건가요? 왜 앞뒤로 움직이면 좋겠다고 생각하시는지요?"}, {"i": 373, "k": "A", "t": "그 전에 그런 식으로 움직이는 거를 본 적이 있는데 ‘이거는 안 움직이네?’ 이렇게 되고, 또 이게 어느 정도 고정이 되는데 사람이 앉은 키가 또 서로가 다른데 이게 더 낮으면 소용이 없더라고요. 더 큰 사람을 위해서는 조절이 돼서 편한지 불편한지가 있지만 더 작은 사람한테는 그게 조절이 불가능하니까.. 차라리 좀 더 뒤로 갔으면 좋겠는데 이게 뒤로 안 가고.. 약간 그런 것들."}, {"i": 374, "k": "S", "t": "ㄴ [pxd] 그런 것 말씀하신 것 생각해보면은 결국 자전거가 있을 때든 없을 때든 장거리갈 때 가장 편안한 시트에 앉고 싶다는 말씀이시죠?"}, {"i": 375, "k": "A", "t": "네. 허리 아픈 것도, 통증도 있으니까. 그런 것들. 오래 운전을 하더라도 좀 더 편안한 상태가 되면.. 그렇지만 그것도 또 모순이죠. 당연히 불편한 것이 맞는 건데.."}, {"i": 376, "k": "S", "t": "ㄴ [pxd] 그러면 자전거를 되게 오래 타시고 다시 운전을 하시려면 엄청 피곤하시고 근력적으로 힘들 수도 있는데 그럴 때 어떤 것이 제일 불편하세요? 아니면 자동차에서 그래도 이런 것을 좀 편하게 해주면 좋겠다는 것이 있으신가요?"}, {"i": 377, "k": "A", "t": "사실 자전거를 타고 나서 운전하는데 그렇게 많은 피로도가 전이되지는 않는데, 다른 운동을 할 때 많이 그런 게 있는 것 같아요. 축구라던지 아니면 다른 크로스핏이나 이런거 하면은 팔에 힘이 없으면 핸들 조정하기가 힘들고.. 그런 게 있긴 한데, 그 운동 때문에 그런 경우는 없었던 것 같아요. 축구를 할 때 공을 오랜만에 차면 발을 올려야 하는데 그게 이제 약간 망가졌다고 해야하나? 그거 말고는.. 어차피 발로 페달 밟는 거니까 상관이 없는 것 같아요."}, {"i": 378, "k": "S", "t": "ㄴ [pxd] 편안한 좌석을 원하신다고 하셨는데 지금 운전석 시트는 어떤 식으로 세팅을 하셨나요? 어떤 것을 신경 써서 세팅을 하신 건가요? 발의 각도일 수도 있고 허리의 각도가 될 수도 있고요."}, {"i": 379, "k": "A", "t": "허리의 각도가 제일 그런 것 같아요. 다른 것은 어느 정도 움직일 수 있잖아요. 다리도 가끔 폈다 접었다 할 수 있는데.. "}, {"i": 380, "k": "S", "t": "ㄴ [pxd] 허리 각도를 신경 쓰시는 거네요."}, {"i": 381, "k": "A", "t": "약간 최대한 누우면 편안하지만 나중에 가면 힘들잖아요. 그런 것 처럼 늘어지지 않는 자세?"}, {"i": 382, "k": "S", "t": "ㄴ [pxd] 편안한 운전 환경을 만들기 위해서 공조라던지 그런 것을 거의 모두 하이로 하신다고 하셨는데, 어떤식으로 환경을 만드시나요? 편안한 환경을 만들기 위해서 노력하시는 것들이 어떤 것이 있는지요?"}, {"i": 383, "k": "A", "t": "공조.. 그냥 더울 때는 시원하게.."}, {"i": 384, "k": "S", "t": "ㄴ [pxd] 아, 특별히 없으시군요. 아니면 레저 아웃도어 하면서 자전거를 넣었을 때 제일 필요한 기능을 하나를 꼽아주신다면 어떤 것이 있나요? 또는 제일 이랬으면 좋겠다는 것이 있으신가요? 아까 스페어 타이어를 활용하고 싶다고 말씀하셨는데, 그런 것 외에 기능적인 것을 꼽아주신다면 혹시 생각나시는 것이 있으신가요?"}, {"i": 385, "k": "A", "t": "제 차가 그렇게 좋은 차는 아니기 때문에 내장재가 딱 플라스틱으로 되어 있는데 그런 부분이 우레탄 같은 것으로 되어있으면 좀 더 나을 수도 있겠다는 생각은 한 거 같아요."}, {"i": 386, "k": "S", "t": "ㄴ [pxd] 어떤 부분이 우레탄으로 되어있으면 좋겠나요?"}, {"i": 387, "k": "A", "t": "뒷 바퀴가 휠이 있으면 바퀴 쪽으로 이렇게 플라스틱이 올라와 있잖아요. 그런 부분이 튀어나와 있는데 그게 튀어나와 있으니까 제일 많이 닿을 거 아니에요. 그런 부분이나 이런 쪽에.."}, {"i": 388, "k": "S", "t": "ㄴ [pxd] 충격 흡수를 할 수 있는것으로요."}, {"i": 389, "k": "A", "t": "네. 그런 것들이 있으면 좀 낫지 않을까 해요."}, {"i": 390, "k": "S", "t": "ㄴ [pxd] 그런 게 결국 자전거가 손상되지 않기 위한 것이군요."}, {"i": 391, "k": "A", "t": "그렇게 되어 있으면 차도 손상이 덜 가지 않을까 싶습니다."}], "items": [{"id": 1, "p": 25, "c": "페인포인트", "th": "외부 거치(랙)의 부담", "ev": "랙을 설치하게 되면 번호판을 새로 달아야 하거든요", "lb": "랙 설치 시 번호판 추가 발급 필요", "st": ""}, {"id": 2, "p": 25, "c": "페인포인트", "th": "외부 거치(랙)의 부담", "ev": "터널에 들어가면서 자전거가 박살나게 되는 경우가 있거든요", "lb": "루프 랙은 높이를 가늠하기 어려워 터널 사고 걱정", "st": ""}, {"id": 3, "p": 29, "c": "페인포인트", "th": "외부 거치(랙)의 부담", "ev": "바깥에 있는 것들은 보험 처리가 안 되기 때문에", "lb": "외부 거치 시 보험 처리 안 된다고 인식", "st": ""}, {"id": 4, "p": 44, "c": "페인포인트", "th": "외부 거치(랙)의 부담", "ev": "번호 미부착으로 걸리면 벌금도 내야 하니까", "lb": "번호판 미부착 벌금 걱정", "st": ""}, {"id": 5, "p": 35, "c": "페인포인트", "th": "싣고 내리는 과정의 번거로움", "ev": "그것조차 귀찮아서요", "lb": "바퀴를 빼서 싣는 것도 귀찮음", "st": ""}, {"id": 6, "p": 159, "c": "페인포인트", "th": "싣고 내리는 과정의 번거로움", "ev": "그렇게는 어떻게 하는지 막막하니까 안 하는 경우인데", "lb": "실내 세워 거치 방법을 몰라 시도하지 않음", "st": ""}, {"id": 7, "p": 346, "c": "페인포인트", "th": "싣고 내리는 과정의 번거로움", "ev": "그 선이 약간 불편할 때도 있어요", "lb": "2열 가운데 안전벨트 선이 적재를 방해", "st": ""}, {"id": 8, "p": 360, "c": "페인포인트", "th": "싣고 내리는 과정의 번거로움", "ev": "한 좌석만 접으면 안 돼가지고.. 안 들어가서..", "lb": "한 좌석만 접어서는 자전거가 안 들어감", "st": ""}, {"id": 9, "p": 234, "c": "페인포인트", "th": "싣고 내리는 과정의 번거로움", "ev": "그거를 넘어서는 경우들이 가끔 있어요", "lb": "트렁크 닫을 때 자전거가 라인을 넘어 재조정", "st": ""}, {"id": 10, "p": 52, "c": "페인포인트", "th": "자전거 손상 걱정", "ev": "겹치는 부분에 자전거가 손상이 되면 안 돼서", "lb": "여러 대 적재 시 겹치는 부분 손상 걱정", "st": ""}, {"id": 11, "p": 56, "c": "페인포인트", "th": "자전거 손상 걱정", "ev": "계속 그 충격이 있으면 안 좋기 때문에", "lb": "눕혀 싣는 동안 좌우 충격 걱정", "st": ""}, {"id": 12, "p": 230, "c": "페인포인트", "th": "자전거 손상 걱정", "ev": "그러면 자전거가 손상이 되니까", "lb": "자동 트렁크가 자전거를 누를까 걱정", "st": ""}, {"id": 13, "p": 151, "c": "페인포인트", "th": "차량 내장재 손상", "ev": "내장재를 손상시키는 경우가 제일 많거든요", "lb": "포크 끝(쇠)이 내장재를 손상", "st": ""}, {"id": 14, "p": 385, "c": "페인포인트", "th": "차량 내장재 손상", "ev": "내장재가 딱 플라스틱으로 되어 있는데", "lb": "딱딱한 플라스틱 내장재", "st": ""}, {"id": 15, "p": 92, "c": "페인포인트", "th": "주행 중 소음·흔들림", "ev": "덜컹덜컹 소리가 나면 신경이 쓰이고", "lb": "적재 후 주행 중 소리·떨림에 신경", "st": ""}, {"id": 16, "p": 94, "c": "페인포인트", "th": "주행 중 소음·흔들림", "ev": "휠들이 돌아다닐 수가 있어요", "lb": "뺀 휠이 차 안에서 움직임", "st": ""}, {"id": 17, "p": 226, "c": "페인포인트", "th": "주행 중 소음·흔들림", "ev": "두 대 이상 실었을 때가 문제인데, 우선은 소리로 신경이 쓰이고요", "lb": "두 대 이상 적재 시 소리가 가장 신경 쓰임", "st": ""}, {"id": 18, "p": 224, "c": "페인포인트", "th": "주행 중 소음·흔들림", "ev": "뒤로 돌아서 보는 편인 것 같아요", "lb": "백미러로 자전거 상태가 안 보여 뒤돌아 확인", "st": ""}, {"id": 19, "p": 135, "c": "페인포인트", "th": "도로 위 안전과 인식", "ev": "위협 운전을 많이 하는 편인 거같아요", "lb": "택시·버스 등의 위협 운전", "st": ""}, {"id": 20, "p": 136, "c": "페인포인트", "th": "도로 위 안전과 인식", "ev": "자전거를 모르는 사람도 많이 있기 때문에.. 그게 제일 문제인 것 같아요", "lb": "운전자들의 자전거에 대한 인식 부족", "st": ""}, {"id": 21, "p": 130, "c": "페인포인트",  else if(CAT[lens]){const l=D.items.filter(i=>i.c===lens);h=`<p class="intro"><b>${lens}</b> — ${CAT[lens].desc}. ${lens==='기능'?'기능은 사용 태도(잘 씀 / 안 씀·끔 / 불안·거부감 / 가끔·중립 / 있으면 좋겠음)로 묶었습니다.':'비슷한 내용끼리 테마로 묶었습니다 (어피니티 1차안).'}</p>`+groupBoard(l)}
 else if(lens==='키워드'){const all=D.kws.map(k=>({k,hits:kwCount(k)})).sort((a,b)=>b.hits.length-a.hits.length);const topic=all.find(a=>a.k.name==='자전거');const arr=all.filter(a=>a!==topic);const max=arr[0].hits.length;
  h='<p class="intro">키워드는 답변에 <b>실제로 나온 단어</b>를 그대로 센 값입니다 (답변 문단 수 기준). 막대나 키워드를 누르면 해당 답변이 모두 나옵니다. <b>많이 나온 단어 ≠ 중요한 문제</b> — 오른쪽 표에서 태그(해석)와 비교해 보세요.</p><div class="two"><div class="chartwrap"><h3>키워드 빈도</h3><p>키워드가 들어간 답변 문단 수 · 총 답변 '+D.paras.filter(p=>p.k==='A').length+'개 · 주제어 “자전거”('+topic.hits.length+')는 그래프에서 제외</p>'+barChart(arr)+'</div><div class="chartwrap"><h3>키워드 × 태그 카테고리</h3><p>키워드가 들어간 답변에 붙은 태그 수 · 진할수록 많음</p>'+heatmap(arr)+'</div></div><div class="kwbar">'+all.map(a=>`<button class="kw ${kwSel===a.k.name?'on':''}" data-k="${esc(a.k.name)}">${esc(a.k.name)}<span>${a.hits.length}</span></button>`).join('')+'</div>';
  if(kwSel){const k=D.kws.find(x=>x.name===kwSel);const hits=kwCount(k);const re=new RegExp('('+k.syn.map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');
   h+=`<p class="intro"><b>${esc(kwSel)}</b> (${k.syn.join(', ')}) — 답변 ${hits.length}개</p>`+hits.map(p=>{const tags=D.items.filter(i=>i.p===p.i);return `<div class="res" data-p="${p.i}"><div class="pid">문단 ${p.i}${tags.length?' · 태그 '+[...new Set(tags.map(t=>t.c))].join(', '):' · 태그 없음'}</div>${esc(p.t).replace(re,'<mark class="k">$1</mark>')}</div>`}).join('')}}
 else if(lens==='원문'){const fx=insFocus&&D.ins.find(x=>x.id===insFocus);const ev=fx?new Set(fx.facts.map(f=>D.items[f-1].p)):null;
  h='<div class="ichips"><button class="ichip '+(!insFocus?'on':'')+'" data-if="">모든 태그</button>'+D.ins.map(x=>`<button class="ichip ${insFocus===x.id?'on':''}" data-if="${x.id}">${x.id} ${esc(x.title.length>16?x.title.slice(0,16)+'…':x.title)}</button>`).join('')+'</div>'+(fx?`<div class="ifocus"><b>${fx.id} · ${esc(fx.title)}</b><br>${esc(fx.st)}<br><small>근거 ${fx.facts.length}개가 있는 답변만 진하게 표시 · 기회: ${esc(fx.hmw)}</small></div>`:'')+'<div class="filt">'+Object.keys(CAT).map(c=>{const k=CAT[c].k;return `<label><input type="checkbox" data-f="${k}" ${filt[k]?'checked':''}><span class="hl-${k}" style="padding:1px 6px;border-radius:4px">${c}</span></label>`}).join('')+'</div><div class="tr">'+D.paras.map(p=>p.k==='A'?`<div class="A ${ev&&!ev.has(p.i)?'dim':''}" id="a${p.i}">${highlightPara(p.i,true)}</div>`:p.k==='Q'?`<div class="Q">${esc(p.t)}</div>`:p.k==='S'?`<div class="S">${esc(p.t)}</div>`:`<div class="Q">${esc(p.t)}</div>`).join('')+'</div>'}
 m.innerHTML=h;const n=Object.values(REV).filter(Boolean).length;document.getElementById('rvc').textContent=`검수 ${n} / ${D.items.length}`}
function openPanel(pi){const {q,s}=prevQ(pi);const tags=D.items.filter(i=>i.p===pi);
 document.getElementById('pb').innerHTML=`${q?`<div class="qq"><b>${esc(q)}</b></div>`:''}${s?`<div class="qq">${esc(s)}</div>`:''}<div class="aa">${highlightPara(pi,false)}</div><div class="tags">${tags.length?tags.map(t=>`<div class="tg" style="background:var(--${CAT[t.c].k}b)"><b>${t.c}</b> · ${esc(t.th)} ${IB(t.id)}<br>${esc(t.c==='기능'?t.lb+' — '+t.st:t.lb)}</div>`).join(''):'<div class="empty">이 답변에는 태그가 없습니다.</div>'}</div><div style="margin-top:16px"><button class="btn" data-goto="${pi}">원문 전체에서 보기 →</button></div>`;
 document.getElementById('ph').textContent='원문 맥락 · 문단 '+pi;document.getElementById('panel').classList.add('open')}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-t]');if(t){lens=t.dataset.t;render();scrollTo(0,0);return}
 const ib=e.target.closest('[data-ins]');if(ib){lens='인사이트';query='';render();const el=document.getElementById('ins-'+ib.dataset.ins);document.getElementById('panel').classList.remove('open');if(el){el.scrollIntoView({block:'start'});window.scrollBy(0,-150);el.style.outline='3px solid #222';setTimeout(()=>el.style.outline='',1600)}return}
 const rb=e.target.closest('.rvb button');if(rb){const id=+rb.closest('.card').dataset.id;REV[id]=REV[id]===rb.dataset.v?'':rb.dataset.v;render();return}
 const c=e.target.closest('.card');if(c){openPanel(D.items.find(i=>i.id==c.dataset.id).p);return}
 const th=e.target.closest('.th');if(th){lens=th.dataset.c;render();return}
 const ig=e.target.closest('[data-insgo]');if(ig){insFocus=ig.dataset.insgo;lens='원문';render();scrollTo(0,0);return}
 const ic=e.target.closest('[data-if]');if(ic){insFocus=ic.dataset.if||null;render();return}
 const evd=e.target.closest('.ev');if(evd){openPanel(+evd.dataset.p);return}
 const kw=e.target.closest('.kw,.brow');if(kw){kwSel=kwSel===kw.dataset.k?null:kw.dataset.k;render();return}
 const r=e.target.closest('.res');if(r){openPanel(+r.dataset.p);return}
 const g=e.target.closest('[data-goto]');if(g){lens='원문';query='';document.getElementById('q').value='';render();document.getElementById('panel').classList.remove('open');const el=document.getElementById('a'+g.dataset.goto);if(el){el.classList.add('focus');el.scrollIntoView({block:'center'})}return}
 if(e.target.id==='px')document.getElementById('panel').classList.remove('open');
});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(f){filt[f]=e.target.checked?1:0;render()}});
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim();render()});
const tip=document.getElementById('tip');document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(t){tip.innerHTML=t.dataset.tip;tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-290)+'px';tip.style.top=(e.clientY+14)+'px'}else tip.style.display='none'});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('panel').classList.remove('open')});
document.getElementById('csv').addEventListener('click',()=>{const rows=[['ID','문단','카테고리','테마','라벨','근거 문구','인사이트','검수']].concat(D.items.map(i=>[i.id,i.p,i.c,i.th,i.c==='기능'?i.lb+' ('+i.st+')':i.lb,i.ev,(IOF[i.id]||[]).join(' '),REV[i.id]||'']));
 const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='U01_태깅_검수결과.csv';a.click()});
render();
</script></body></html>
